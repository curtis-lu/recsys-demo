# Production overrides — Hive tables on HDFS。
# 三層 versioning：base_dataset_version 對應「與抽樣無關」的不變產物；
# train_variant_id 對應「依 train sampling」的產物；calibration_variant_id
# 對應「依 calibration sampling」的產物。Hive 表為固定名稱，版本以
# partition_filter 的 partition column 區分；driver-local artifacts（如
# preprocessor.json）落在 data/dataset/${base_dataset_version}/ 版本化路徑。

# hive.db 定義於 parameters.yaml，供 catalog.yaml 參照。

# --- Source tables（唯讀，由 source_etl 維護）---
feature_table:
  type: HiveTableDataset
  database: ${hive.db}
  table: feature_table
  read_only: true

label_table:
  type: HiveTableDataset
  database: ${hive.db}
  table: label_table
  read_only: true

sample_pool:
  type: HiveTableDataset
  database: ${hive.db}
  table: sample_pool
  read_only: true

inference_population:
  type: HiveTableDataset
  database: ${hive.db}
  table: inference_population
  read_only: true

# --- Dataset base layer（依 base_dataset_version 區分）---
# 每個邏輯 artifact 一張 Hive table；base_dataset_version 是外層 partition column，
# snap_date 為內層的 dynamic partition。
val_keys:
  type: HiveTableDataset
  database: ${hive.db}
  table: recsys_prod_val_keys
  external: false
  columns: "auto"
  partition_filter:
    base_dataset_version: ${base_dataset_version}
  partition_cols:
    - {name: snap_date, type: STRING}

test_keys:
  type: HiveTableDataset
  database: ${hive.db}
  table: recsys_prod_test_keys
  external: false
  columns: "auto"
  partition_filter:
    base_dataset_version: ${base_dataset_version}
  partition_cols:
    - {name: snap_date, type: STRING}

val_model_input:
  type: HiveTableDataset
  database: ${hive.db}
  table: recsys_prod_val_model_input
  external: false
  columns: "auto"
  partition_filter:
    base_dataset_version: ${base_dataset_version}
  partition_cols:
    - {name: snap_date, type: STRING}

test_model_input:
  type: HiveTableDataset
  database: ${hive.db}
  table: recsys_prod_test_model_input
  external: false
  columns: "auto"
  partition_filter:
    base_dataset_version: ${base_dataset_version}
  partition_cols:
    - {name: snap_date, type: STRING}
    - {name: prod_name, type: STRING}

preprocessor:
  type: JSONDataset
  filepath: data/dataset/${base_dataset_version}/preprocessor.json

category_mappings:
  type: JSONDataset
  filepath: data/dataset/${base_dataset_version}/category_mappings.json

# 診斷副產物，零下游消費者——條目在這裡是為了讓它撈得出來看（pipeline-node-design
# 規則 1），不是為了餵誰，前例是 sample_weight_report。validate_numeric_precision
# 只回傳 dict，寫檔由這個條目負責。
#
# 為什麼值得落地而不是只印 log：閘門的 pass/fail 答不出「哪一欄快要撐不住了」。
# 這份報告每一欄都有 headroom（上限 ÷ 實際最大值），最接近爆掉的排最前面，所以
# 「下個月會不會被擋」在被擋之前就看得到。
#
# ⚠ policy=block 且真的有欄超界時，run 會中止，這個檔**不會**落地（node 沒回傳，
#   catalog 就沒東西可寫）。整張表在 raise 之前已經進 log；要拿到檔案就用
#   numeric_precision_policy: truncate 跑一輪。
numeric_precision_report:
  type: JSONDataset
  filepath: data/dataset/${base_dataset_version}/numeric_precision_report.json

# --- Dataset train-variant layer（依 base + train_variant 區分）---
sample_keys:
  type: HiveTableDataset
  database: ${hive.db}
  table: recsys_prod_sample_keys
  external: false
  columns: "auto"
  partition_filter:
    base_dataset_version: ${base_dataset_version}
    train_variant_id: ${train_variant_id}
  partition_cols:
    - {name: snap_date, type: STRING}

train_keys:
  type: HiveTableDataset
  database: ${hive.db}
  table: recsys_prod_train_keys
  external: false
  columns: "auto"
  partition_filter:
    base_dataset_version: ${base_dataset_version}
    train_variant_id: ${train_variant_id}
  partition_cols:
    - {name: snap_date, type: STRING}

train_dev_keys:
  type: HiveTableDataset
  database: ${hive.db}
  table: recsys_prod_train_dev_keys
  external: false
  columns: "auto"
  partition_filter:
    base_dataset_version: ${base_dataset_version}
    train_variant_id: ${train_variant_id}
  partition_cols:
    - {name: snap_date, type: STRING}

preprocessed_feature_table:
    type: HiveTableDataset
    database: ${hive.db}
    table: recsys_prod_preprocessed_feature_table
    external: false
    columns: "auto"
    partition_filter:
      base_dataset_version: ${base_dataset_version}
    partition_cols:
      - {name: snap_date, type: STRING}

train_model_input:
  type: HiveTableDataset
  database: ${hive.db}
  table: recsys_prod_train_model_input
  external: false
  columns: "auto"
  partition_filter:
    base_dataset_version: ${base_dataset_version}
    train_variant_id: ${train_variant_id}
  partition_cols:
    - {name: snap_date, type: STRING}

train_dev_model_input:
  type: HiveTableDataset
  database: ${hive.db}
  table: recsys_prod_train_dev_model_input
  external: false
  columns: "auto"
  partition_filter:
    base_dataset_version: ${base_dataset_version}
    train_variant_id: ${train_variant_id}
  partition_cols:
    - {name: snap_date, type: STRING}

# --- Dataset calibration-variant layer（依 base + calibration_variant 區分）---
calibration_keys:
  type: HiveTableDataset
  database: ${hive.db}
  table: recsys_prod_calibration_keys
  external: false
  columns: "auto"
  partition_filter:
    base_dataset_version: ${base_dataset_version}
    calibration_variant_id: ${calibration_variant_id}
  partition_cols:
    - {name: snap_date, type: STRING}

calibration_model_input:
  type: HiveTableDataset
  database: ${hive.db}
  table: recsys_prod_calibration_model_input
  external: false
  columns: "auto"
  partition_filter:
    base_dataset_version: ${base_dataset_version}
    calibration_variant_id: ${calibration_variant_id}
  partition_cols:
    - {name: snap_date, type: STRING}

# --- Training pipeline — binary / 非 DataFrame artifact（driver-local）---
# ModelAdapterDataset / JSONDataset 用 Python 內建 open() 寫檔，不認 hdfs:// scheme，
# 因此寫到 driver-local fs（與 cached_* 同一原則）。
model:
  type: ModelAdapterDataset
  filepath: data/models/${model_version}/model.txt

best_params:
  type: JSONDataset
  filepath: data/models/${model_version}/best_params.json

best_iteration:
  type: JSONDataset
  filepath: data/models/${model_version}/best_iteration.json

# hpo/ subdirectory is REQUIRED: ModelAdapterDataset writes a model_meta.json
# sidecar next to its filepath; sharing a directory with `model` would let the
# two datasets overwrite each other's sidecar (calibration flag cross-talk).
# Persisted (with best_iteration) so `training --from-node finalize_model`
# can skip tune_hyperparameters entirely.
hpo_best_model:
  type: ModelAdapterDataset
  filepath: data/models/${model_version}/hpo/model.txt

# calibration 開啟時 finalize_model 的輸出（calibrate_model 再把它包成 `model`）。
# 落地買的是「`--from-node calibrate_model` 不會把 finalize_model 拉回重跑」——
# 在 final_model_strategy: refit_on_full 下那是一次完整 refit。契約釘在
# tests/test_pipelines/test_resume_contracts.py 的 calibration 變體。
# trained/ 子目錄同 hpo/ 的理由：ModelAdapterDataset 會在 filepath 旁寫
# model_meta.json sidecar，與 `model` 共用目錄會互相覆寫 calibration 旗標。
trained_model:
  type: ModelAdapterDataset
  filepath: data/models/${model_version}/trained/model.txt

# predict_and_write_test_predictions 對每個設定月份的決定：months_processed／
# months_skipped／months_rebuilt 三份**清單**（外加這一次實際寫了什麼）。落地的
# 兩個理由：
#   1. 一個決定「少做一些工」的 node 必須說出它決定不做什麼。log 留下的是計數，
#      而一個靜默過期的月份跟一個正確跳過的月份在計數上長得一模一樣。
#   2. 它是 `--from-node compute_test_mAP_spark`／診斷那一帶的必要輸入。不落地時
#      切片會把 predict node 拉回來，那個 node 就算全部月份都 skip，開頭仍要把約
#      2.2 億列 × 2 個字串欄拉進 driver 算 distinct（issue #233）。
# ⚠ 落地的代價：切片會從磁碟載回**上一次** run 的 manifest 而不再補跑 predict。
# 今天是安全的，因為兩個消費者都只拿它當 DAG 排序依賴——compute_test_mAP_spark
# 把它寫進 log（數字讀回來的是上一次的），select_shap_population 連讀都沒讀。
# 哪天有人真的從裡面取值來算東西，這個條目就變成正確性風險，要一起重審。
# 位置與 sample_weight_report 同理：版本目錄第一層，放進 diagnostics/ 就會從
# manifest.json 的 artifacts 清單裡靜默消失（__main__._dir_artifacts 只列第一層）。
predict_manifest:
  type: JSONDataset
  filepath: data/models/${model_version}/predict_manifest.json

evaluation_results:
  type: JSONDataset
  filepath: data/models/${model_version}/evaluation_results.json

# 診斷副產物，零下游消費者——條目在這裡是為了讓它撈得出來看（規則 1），不是
# 為了餵誰。persist_sample_weight_report 只回傳 dict，寫檔由這個條目負責。
# 檔名與位置是契約的一部分：__main__.py 的 _sample_weight_extra 讀
# <version dir>/sample_weight_report.json 放進 manifest 的 extra_metadata，而
# artifacts 清單只列版本目錄第一層——放進 diagnostics/ 兩者都會靜默失去。
sample_weight_report:
  type: JSONDataset
  filepath: data/models/${model_version}/sample_weight_report.json

feature_statistics:
  type: JSONDataset
  filepath: data/models/${model_version}/diagnostics/feature_statistics.json

feature_importance:
  type: JSONDataset
  filepath: data/models/${model_version}/diagnostics/feature_importance.json

shap_diagnostics:
  type: JSONDataset
  filepath: data/models/${model_version}/diagnostics/shap_diagnostics.json

quadrant_profiles:
  type: JSONDataset
  filepath: data/models/${model_version}/diagnostics/per_quadrant.json

cases_manifest:
  type: JSONDataset
  filepath: data/models/${model_version}/diagnostics/cases/cases_manifest.json

gain_ledger:
  type: JSONDataset
  filepath: data/models/${model_version}/diagnostics/gain_ledger.json
  # optional: 訓練側未跑該 node 時 load() 回 None 而非 raise——evaluation 的
  # model_capacity 診斷（2026-07-20 接上）把它當 node input，單獨跑
  # evaluation、或訓練側是舊版沒跑過這個 node 時都可能是 None，這是正常路徑
  # （見 diagnosis/metric/model_capacity/_compute.py 的三種拿不到資料路徑）。
  optional: true

# --- Evaluation pipeline — 診斷產物（Phase 1 起；抽樣估計，含 sample metadata）---
evaluation_metric_ci:
  type: JSONDataset
  filepath: data/evaluation/${model_version}/${snap_date}/diagnosis/metric_ci.json

# registry 診斷（diagnosis.metric.contract.DIAGNOSES）1／4
evaluation_config_shift:
  type: JSONDataset
  filepath: data/evaluation/${model_version}/${snap_date}/diagnosis/config_shift.json

evaluation_item_ability:
  type: JSONDataset
  filepath: data/evaluation/${model_version}/${snap_date}/diagnosis/item_ability.json

evaluation_model_capacity:
  type: JSONDataset
  filepath: data/evaluation/${model_version}/${snap_date}/diagnosis/model_capacity.json

evaluation_suppression:
  type: JSONDataset
  filepath: data/evaluation/${model_version}/${snap_date}/diagnosis/suppression.json

# 主報表診斷區的 Spark 聚合（Plan 1.5 從 generate_report 拆出）。
# 落地的理由不只是快取：generate_report 因此變成純函式，主報表可以離線重繪。
evaluation_report_aggregates:
  type: JSONDataset
  filepath: data/evaluation/${model_version}/${snap_date}/report_aggregates.json

evaluation_report:
  type: TextDataset
  filepath: data/evaluation/${model_version}/${snap_date}/report.html

evaluation_comparison_report:
  type: TextDataset
  filepath: data/evaluation/${model_version}/${snap_date}/report_comparison.html

# Note: training cache 由 training/nodes.py 的 5 個 cache_*_model_input node
# 經 training/steps/local_cache.py::populate_cache_from_hive 直接從 Hive table
# location `copyToLocal` 搬到 driver-local parquet，不經 catalog 持久化；cache
# node outputs（ParquetHandle）走 framework auto-MemoryDataset 在 DAG 中銜接。

# --- Training pipeline — test-set 預測結果（供下游 evaluation 重複使用）---
# 由 training/nodes.py::predict_and_write_test_predictions 寫入；同 pipeline
# 內由 compute_test_mAP_spark 與 evaluation/nodes_spark.py::prepare_eval_data
# (--post-training mode) 讀回。只有 test window 內至少 1 個 positive label 的
# 客戶會被 scoring 並寫入；不存 rank ──Spark mAP 端會用 rank_within_query
# 重算。
training_eval_predictions:
  type: HiveTableDataset
  database: ${hive.db}
  table: training_eval_predictions
  external: false
  columns:
    - {name: cust_id, type: STRING}
    - {name: score, type: DOUBLE}
    - {name: score_uncalibrated, type: DOUBLE}  # 模型原始輸出；calibration 關閉時等於 score
    - {name: label, type: INT}
  partition_filter:
    model_version: ${model_version}
  partition_cols:
    - {name: snap_date, type: STRING}
    - {name: prod_name, type: STRING}

# --- Evaluation pipeline — 快取後可直接用於 report 的 eval_predictions ---
# 由 evaluation/comparison_nodes.py::persist_eval_predictions 寫入
# （prepare_eval_data 產出、做完 label join、rank 與 segment enrichment 後的
# in-memory eval_predictions）。--compare-only 模式由 catalog auto-load 讀回，
# 並由 validate_enriched_eval_predictions_present（B4 validator）檢查。
# columns: "auto" ── schema 從 DataFrame 推得；segment_sources 設定在兩次 run
# 之間改變時，HiveTableDataset 會自動 append-only 演化（ALTER TABLE ADD
# COLUMNS／缺欄補 NULL），不需先 drop table。
enriched_eval_predictions:
  type: HiveTableDataset
  database: ${hive.db}
  table: enriched_eval_predictions
  external: false
  columns: "auto"
  partition_filter:
    model_version: ${model_version}
  partition_cols:
    - {name: snap_date, type: STRING}

# --- Inference pipeline — 評分用的中間特徵表（managed Hive table）---
# build_inference_population_features 的輸出。顆粒度 (snap_date, cust_id)：
# **刻意不含 item 展開**，因為 (entity, item) 的特徵向量就是該 entity 的特徵加上
# 一個類別純量，展開等於把同一列抄 |products| 遍去配 |products| 個純量，那些副本
# 零資訊。落地它讓 feature_table 的完整掃描從每月 |products| 次降到 1 次
# （ADR-0010 §4 的成本表：22 FT → 3 FT）。
#
# columns: "auto" 存的是 preprocessor.json 特徵欄的**全集**（扣掉 prod_name），
# 不是任何一個模型實際使用的子集。子集只在 predict 的 chunk 內由
# model.feature_names() 切出來——**不要「順手優化」成只存模型要的欄**：那會讓這張
# 表與 model_version 綁死，「同一個 base 版本下換模型可以整張重用」這個性質會靜默
# 消失，而且沒有任何檢查會紅（ADR-0010 §5）。
#
# 所以 partition_filter 是 base_dataset_version 而不是 model_version：它只依賴
# 來源表與 preprocessor.json（住在 data/dataset/${base_dataset_version}/），與模型無關。
#
# entity_bucket 是 cust_id 的確定性 crc32 分桶（utils/hashing.py 的 spark_bucket，
# 桶數＝inference.entity_buckets）。它是為了滿足「一次 save 恰好一個分區」而存在的
# 機制欄，**只進本表與 unranked_predictions，不進對外表**——rank_predictions 讀完就丟。
inference_population_features:
  type: HiveTableDataset
  database: ${hive.db}
  table: inference_population_features
  external: false
  columns: "auto"
  partition_filter:
    base_dataset_version: ${base_dataset_version}
  partition_cols:
    - {name: snap_date, type: STRING}
    - {name: entity_bucket, type: STRING}

# --- Inference pipeline — 三張輸出表共用的分區形狀 ---
# 三張都是 `partition_filter: model_version`，與 training_eval_predictions 同構。
# 那不是巧合——同一個問題已經被解過一次（ADR-0009，其「這條 ADR 沒有解決的事」
# 那條就是這三張表，#187 把它劃掉）。
#
# partition_cols 三張並不相同：`unranked_predictions` 多一個 entity_bucket
# （#188／ADR-0010 §5），另外兩張是 snap_date + prod_name。
#
# 為什麼 model_version 是 filter 而不是 partition_col：一次 publish 就是一個
# model_version，所以 load 可以直接發 `WHERE model_version = '…'`，而 save 之後
# 可以拿 metastore 快照的 before／after 差集報出「這次寫了哪些分區」。留在
# partition_cols 時 existing_partition_values() 答的是整張表跨所有 run 的累積，
# 差集分不出「這次覆寫的」與「早就在那的」——重新發布會印出「0 new」
# （issue #179／ADR-0010 §5）。
#
# ⚠ 這三張表的分區形狀在 #187 改過，那是一次**破壞性遷移**：partition_filter 的
# 鍵在實體分區順序上排在 partition_cols 之前，而 CREATE TABLE IF NOT EXISTS 不會
# 修改既有表、insertInto 又是位置對應。就地套用新設定會把 model_version 的值寫進
# snap_date 分區欄，且零錯誤訊息。既有環境必須先 DROP 再重建——步驟見
# docs/pipelines/inference.md §6.5。
#
# ⚠ #188 又動了一次，這次只有 `unranked_predictions`：多一個 entity_bucket
# partition col。同樣**必須 DROP 重建**（CREATE TABLE IF NOT EXISTS 不改既有表）。
# 這一次的失效方向比 #187 溫和——欄數從 5 變 6，insertInto 會直接 raise 而不是靜默
# 寫錯欄——但仍然要先 DROP，步驟同 §6.5。

# --- Inference pipeline — 未排名分數（managed Hive table）---
# predict_and_write_scores 自己逐分區寫入本表（Node(writes=…)，登記在
# architecture-constraints.md 的 R1）。`_table` 後綴在本 repo 只用於來源表
# （feature_table／label_table／sample_pool），所以這張中間產物叫
# unranked_predictions（#187 之前叫 score_table）。
#
# 第三個 partition_col entity_bucket 不是分類需求，是**正確性需求**：save 是
# insertInto + partitionOverwriteMode=dynamic，語意是「只動這次 frame 裡出現的
# 分區，但對出現的那些是整個刪掉重建」。少了這一欄，第 2 個 bucket 的 save 會把
# 第 1 個 bucket 剛寫的 (snap_date, prod_name) 分區整個換掉，跑完只剩最後一個
# bucket——資料少 (B-1)/B 且零錯誤訊息（ADR-0010 §3 約束 C）。
unranked_predictions:
  type: HiveTableDataset
  database: ${hive.db}
  table: unranked_predictions
  external: false
  columns:
    - {name: cust_id, type: STRING}
    - {name: score, type: DOUBLE}
  partition_filter:
    model_version: ${model_version}
  partition_cols:
    - {name: snap_date, type: STRING}
    - {name: prod_name, type: STRING}
    - {name: entity_bucket, type: STRING}

# --- Inference pipeline — 發布前 staging（managed Hive table）---
# rank_predictions 先把排名寫進 staging；validate_predictions 讀此表跑 sanity
# checks（raise 即整批中止）。驗證通過後才由 publish_predictions 寫入 production
# 的 ranked_predictions。驗證失敗時 production 完全不被觸碰，本表保留失敗批次供排查。
ranked_staging:
  type: HiveTableDataset
  database: ${hive.db}
  table: ranked_staging
  external: false
  columns:
    - {name: cust_id, type: STRING}
    - {name: score, type: DOUBLE}
    - {name: rank, type: BIGINT}
  partition_filter:
    model_version: ${model_version}
  partition_cols:
    - {name: snap_date, type: STRING}
    - {name: prod_name, type: STRING}

# --- Inference pipeline（續）— production 輸出 + Evaluation 讀取端入口 ---
# 由 publish_predictions 寫入（唯一一次 production 寫入，且只在 validate 通過後執行）。
# evaluation pipeline 也讀這張表；獨立宣告確保它在同 session 沒跑 inference 時也能
# standalone 讀，避免 DataCatalog 對未知名稱 fallback 成 MemoryDataset 而「靜默地壞掉」
# （此 footgun 的正典說明見 docs/design-principles.md §9）。
ranked_predictions:
  type: HiveTableDataset
  database: ${hive.db}
  table: ranked_predictions
  external: false
  columns:
    - {name: cust_id, type: STRING}
    - {name: score, type: DOUBLE}
    - {name: rank, type: BIGINT}
  partition_filter:
    model_version: ${model_version}
  partition_cols:
    - {name: snap_date, type: STRING}
    - {name: prod_name, type: STRING}

# --- Inference pipeline — 這一次跑了哪些 chunk（診斷副產物）---
# 零下游消費者，條目在這裡是為了讓它撈得出來看（pipeline-node-design 規則 1），
# 前例是 sample_weight_report 與 numeric_precision_report。
#
# ⚠ 這不是 score_manifest 的落地版，**score_manifest 刻意不進本檔**。理由在
# docs/pipelines/inference.md §7.4：它是 memory-only，所以任何切片都會補跑評分
# 節點；一旦落地，`--from-node rank_predictions` 會改成從磁碟載回上一次的
# manifest，而 validate_predictions 是**取值**用它（expected_partitions /
# written_partitions），於是驗證會拿另一次 run 的數字。本條目沒有這個問題，因為
# 沒有任何 node 讀它。
#
# 體積隨 chunk 數線性成長：生產 12 月 × 20 桶 × 22 item ≈ 5,280 chunk，六份清單
# 加起來約 1 MB 等級。manifest.json 只收摘要（計數 ＋ 每月一列），逐 chunk 清單
# 只在這個檔裡——__main__.py 的 _chunk_report_extra 讀本檔的摘要欄位放進
# manifest 的 extra_metadata，所以檔名與位置是契約的一部分。
score_chunk_report:
  type: JSONDataset
  filepath: data/inference/${model_version}/${snap_date}/chunk_report.json
