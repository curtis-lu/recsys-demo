evaluation:
  # Evaluation 的 snap_date：一個日期，或多個日期合起來評估（所有日期的
  # query group 進同一份指標與報表）。三種寫法：
  #   snap_date: "2026-01-31"                          # 一個日期
  #   snap_date: ["2026-01-31", "2026-02-28"]          # 逐一列出
  #   snap_date: {start: "2026-01-31", end: "2026-03-31", step: month_end}
  #                                                    # 區間，含頭含尾
  # 區間的 step 是 day／week／month_start／month_end，起迄兩端都必須落在
  # step 上，載入時展開成清單。日期一律 ISO 格式（YYYY-MM-DD）：evaluation
  # pipeline 會把它和 DATE-typed snap_date column cast 成字串後比較
  # （cast 結果就是 YYYY-MM-DD）。輸出路徑的子目錄：一個日期是 YYYYMMDD/，
  # 多個日期是 <最早>-<最晚>/（只看起迄）。詳見 docs/pipelines/evaluation.md §3.1。
  snap_date: "2026-01-31"

  # 單一 k superset。此處列出的每個 k 都會被算進所有 @K metric、所有粒度
  #（fine product overall/per-item/per-segment 與 category）。Report 各段
  # 透過 report.display.* 自行選要展示哪些 k 欄位。"all" 會在 runtime
  # 解析成該粒度的 distinct item 數。
  k_values: [1, 2, 3, 4, 5, "all"]

  # Per-segment metrics 切片用的 segment column。欄從該執行模式的母體表取：
  # --post-training＝sample_pool、監控＝inference_population，以 (time, entity)
  # join。母體表沒有這欄時不中止，只在 log 與報表註明（ADR-0020 bug 6）；
  # 示例的 inference_population 沒有 cust_segment_typ，監控模式會走這條路。
  segment_columns:
    - cust_segment_typ

  # 可選的覆寫：segment 在另一張外部 Hive table 時才設，鍵＝segment_columns 裡的
  # 欄名。每個覆寫要有 `table`（Hive-qualified）、`key_columns`、`segment_column`
  # （必須等於鍵），缺一個 CLI 入口就擋（A10）；設定了但讀不到的表會 fail loud。
  segment_sources: {}
  # 外部 Hive table 範例（保持註解狀態 ── 預設沒有這張表；若 enable
  # 卻沒有真實 table，evaluation 會 fail loud）：
  # segment_sources:
  #   holding_combo:
  #     table: ml_recsys.holding_combo
  #     key_columns: [cust_id, snap_date]
  #     segment_column: holding_combo

  # 產品大類的 parallel evaluation。enable 後，fine-grained 的評估列
  # 會被 collapse 到 category 粒度（category score = max child score == best
  # child rank；category label = max child label），然後對「同一套」metric
  # pipeline 跑第二輪；結果 nest 在 "category" key 之下。
  item_categories:
    enabled: true                # bool
    unmapped: singleton          # ∈ {singleton}（目前唯一支援）；沒列入任何 list 的 product 自成一類
    mapping:                      # ★大類 → 子 product 清單（值由你定義；右側須 A6 已知 item）
      fund: [fund_stock, fund_bond, fund_mix]
      exchange: [exchange_fx, exchange_usd]
      ccard: [ccard_bill, ccard_cash, ccard_ins]
    # 不想手寫 mapping 時改寫 column（與 mapping 二選一，兩個都寫會被 A51 擋）：
    # 每個 item 的大類取自 sample_pool 的這一欄，只看這次評估的月份；只支援
    # --post-training（A51）。同一個 item 對到兩個不同的非 NULL 值會被 B18 擋；
    # 全是 NULL 的 item 自成一類。細節：docs/pipelines/evaluation.md §3.3。
    # column: <sample_pool 的欄名>

  # Baseline 設定 ── popularity baseline 的 lookback 視窗（月數）。
  baseline:
    lookback_months: 12
    # score：熱門度基準線用哪個分數排名（#397；合法值由 A50 檢查）。
    #   count（沒寫＝這個）  回看期間的正例數，從 label_table 算。
    #   rate                 正例率＝正例數 ÷ 當過候選的次數，分母從 sample_pool 數。
    #                        候選集合是被展示的子集時（例如廣告）才需要：正例數會偏向
    #                        被展示最多的 item。只在 --post-training 生效；監控模式評的
    #                        是全網格，照舊用正例數。每期的兩個數落在
    #                        popularity_period_counts，算過的期不重算；補過來源資料要帶
    #                        --rebuild-dates。前提見 docs/pipelines/evaluation.md §3.4。
    # score: rate

  # 預測品質指標家族（ADR-0024）：把每一列評估資料當一次二元預測，照分數分箱，
  # 算 precision／recall／F1／pr_auc／roc_auc 與分箱表（每格的平均分數 vs 實際
  # 正例率），整體＋per-item。開關是下面的 report.sections.prediction_quality
  # （框架預設關）；這裡只放怎麼算。三個鍵的合法值由 A42 檢查。
  #   n_bins          細箱數：全域等寬，範圍取本次資料的最小～最大分數（不是 [0, 1]）。
  #                   門檻只算得到箱的邊界，所以 bin 寬＝F1 最佳門檻的解析度。
  #   n_display_bins  報表分箱表的格數：每格合併 n_bins ÷ n_display_bins 個細箱，
  #                   必須整除 n_bins。
  #   top_n           per-item 預算：只有列數最多的前 top_n 個 item 有自己的分箱與
  #                   指標（item × 細箱會回 driver）；其餘 item 仍算進整體。0＝不列。
  prediction_quality:
    n_bins: 1000
    n_display_bins: 10
    top_n: 30

  # Report 產生選項
  # 這一區的鍵分兩類（ADR-0020 決定二；完整對照表在
  # src/recsys_tfb/pipelines/evaluation/steps/config_fingerprint.py 的 COMPUTED_KEYS）：
  #   「算的」：sections.baseline、sections.diagnostics、sections.prediction_quality、
  #     diagnostics.*、上面的 prediction_quality.*。它們決定要不要算、
  #     怎麼算，會進落地 JSON 的設定指紋。改了要照錯誤訊息點名的 --from-node 重跑
  #     （對照表在 pipelines/evaluation/steps/config_fingerprint.py 的 COMPUTED_KEYS；不一定是產出那份
  #     JSON 的 node）；只做 --only-node generate_report 會被擋下，錯誤訊息會寫出變了
  #     哪個鍵、該 --from-node 哪個 node。
  #   「畫的」：sections 其餘鍵、display.*。只改報表長相，改完 --only-node generate_report 即可。
  # sections 的鍵必須剛好是報表讀的這六個：多寫一個（沒人讀、設了沒用）或少寫一個
  # （讀了卻關不掉），evaluation 指令一進來就擋（A34，清單在 core/consistency.py 的
  # EVALUATION_REPORT_SECTIONS）。
  report:
    sections:
      dataset_overview: true
      primary_map: true          # 衡量指標段：overall、per-item、per-segment、大類
      diagnostics: true          # 算的：false 時 compute_report_aggregates 只寫 stub
      baseline: true             # 算的：false 時 compute_baseline_metrics 只寫 stub
      diagnosis_links: true      # 主報表指向診斷頁的入口（只有 --post-training 有頁可指）
      prediction_quality: false  # 算的：預測品質指標家族（見上方 prediction_quality）；
                                 # false 時 compute_prediction_quality 只寫 stub
    display:                     # 畫的
      primary_map_k: [1, 3, 5, "all"]
      guardrail_recall_k: [1, 2, 3, 4, 5]
    diagnostics:                 # 算的
      include_distributions: true
      # 診斷圖在 Spark 端聚合（bin 計數／quartile／rank 矩陣），體積與列數無關，
      # 不再需要 row 抽樣上限。

  # 主指標參數化家族（框架診斷項目 4；A15）。預設值全部等價現行為：
  # weight_alpha=0 ＝ item 等權 macro；min_positives=0 ＝ 不設觀察名單門檻；
  # shrinkage_k=0 ＝ 不收縮。作用順序：min_positives 先排除 → shrinkage 向
  # pooled（n_pos 加權）平均收縮 → weight_alpha 加權（w_j ∝ n_pos^α）。
  # 只作用於 item 粒度（by_item / by_item_segment）；by_segment 維持等權。
  # k = 主指標家族（per-item macro 的點估與 CI）計算 AP 的截斷 k；null ＝ 不截斷
  # （full mAP）。跟 k_values 是兩個獨立的軸：不必列在 k_values 裡，主線會自己補算
  # map_attr@k。
  metric:
    weight_alpha: 0.0
    k: null
    min_positives: 0
    shrinkage_k: 0

  # 全正的 query group 過濾（#376；預設關，連父鍵一起註解——CONTEXT.md
  # 的「全正的 query group」）。全正＝組內每一筆候選的 label 都是正例
  # （label 有分級時，每一筆都是同一個正值），不管怎麼排，它的組層級排序
  # 指標（mAP／precision／recall）都一樣、排法分不出好壞。開了之後，衡量
  # 指標（overall／per-item／分群／大類）、熱門度基準線，以及
  # `--compare`／`--compare-only` 比較報表的兩側都排除這種組（兩側各自依
  # 自己的列判定）；不論開或關都會多印全正組數與佔比，佔比超過 10%（寫死
  # 在程式，非設定鍵）就警告。**不套用**：頭號 mAP、報表診斷段、各診斷、
  # training 的 test mAP 與 HPO 目標（唯讀入口見
  # `evaluation/metrics.py::drop_all_positive_groups`；設定檢查見
  # `core/consistency.py` A49）。改這個鍵要從 compute_metrics 重跑
  # （`COMPUTED_KEYS`）。
  # query_filter:
  #   drop_all_positive_groups: false

  # 評估側診斷（Phase 1 起；spec §2 共用抽樣底座 + §3 Phase 1 CI）。
  # 每項診斷只有這一個開關。關掉 => 仍會落地一份 {"enabled": false} 的 stub
  # JSON、但不產生頁面。想讓一項診斷「完全不存在」是改 code
  # （diagnosis.metric.contract.DIAGNOSES），不是改這裡。
  diagnosis:
    # 診斷抽樣：單位＝query（snap_date × cust_id）、只取有正例的 query；
    # 兩趟設計——正例 query 數低於保底的 item 整批全取，其餘 CRC32
    # hash-ratio 抽到補滿 max_queries。中型 item 抽後仍可能低於保底：
    # 不硬補，metadata 誠實回報（報表會標示樣本規模）。
    # max_queries 設在「有正例的 query 總數」之上 → ratio == 1.0 → 不觸發
    # 次抽樣，診斷是母體普查而非抽樣估計。2026-07-19 實況：公司環境有正例的
    # query 約 22 萬，故設 25 萬。driver 記憶體不是約束（128GB；25 萬 query ×
    # 22 個 item ≈ 5.5M 列 ≈ 1.25GB）。
    #
    # ⚠ 若母體成長超過此值，次抽樣會自動恢復：分層權重（inclusion_weight）
    # 會接手做 Horvitz–Thompson 修正，metadata 的 sampling_description 也會
    # 從「未抽樣」改口。**不會靜默偏差**，但普查的解讀更乾淨，發現超過時
    # 優先調高這個值而不是靠加權。
    #
    # 這個值不是控制運算成本的旋鈕——貴的診斷各自有自己的預算旋鈕，
    # 原則是「搜尋用子樣本、量測用全樣本」。
    # 用縮小共用樣本來省錢會讓便宜的診斷也一起失去母體性。
    sample:
      max_queries: 250000
      min_pos_queries_per_item: 50
      seed: 42
    # per-item AP 與 macro 的 cluster bootstrap CI（cluster＝cust_id，
    # 同一客戶跨期整批重抽）。driver 端 numpy、跑在上面的抽樣上。
    ci:
      enabled: true
      n_boot: 200

    # 診斷 1／4：配置引入的排序偏移。純 config 算術＋2 次 mAP＋每 item 一次
    # 替換實驗。讀 schema 的 score 角色欄（offset 活在模型輸出的 log-odds
    # 空間，而 #411 移除校準器之後 score 就是模型原始輸出）。
    config_shift:
      enabled: true

    # 診斷 2／4：item 排序能力——同一 item 內正例列 vs 負例列的加權 AUC，
    # raw（原始分數）與 query_centered（扣掉各自 query 平均後）各算一次；
    # 差值即客戶活躍度被誤計入 item 推薦能力的量。讀 schema 的 score 角色欄
    # （與 config_shift 同一個 log-odds 空間）。top_n＝正例名次百分位分布只看
    # macro per-item AP 最低的前幾個 item。
    item_ability:
      enabled: true
      top_n: 30

    # 診斷 3／4：模型容量分配——全模型 split gain 分成 Item Prior（item-id
    # 切點）、Post-Item Context（item 切點之後的 context 切點，逐 item 分配）
    # 與未分配三份；用來分辨「學到互動訊號」與「只記住 item prior」。不吃
    # 診斷抽樣，只讀訓練側的 gain_ledger（optional，可能缺席）＋同一次執行
    # 的 item_ability 結果畫對照散點。
    model_capacity:
      enabled: true

    # 診斷 4／4：壓制帳本與交叉購買——同一 query 內，label=0 的 item 排在
    # label=1 之前時，把該正例列的 AP 缺口依比例分攤給排在它上面的每個負例
    # （壓制矩陣熱圖）；並列出同一批 query 單位上的實際標籤共買 lift（泡泡
    # 格圖，同軸序對照）。top_examples＝具體案例表最多列出幾筆。
    suppression:
      enabled: true
      top_examples: 50

  # Compare sources（多模型比較）。有填內容的 entry 才 unlock
  # `evaluation --compare <key>` / `--compare-only <key>`；<key>（v_prev/ext_proj_x…）
  # 即 CLI flag 傳的值。★整段（含 key 名與各值）由你定義；預設空。
  # 完整 schema 由 core/consistency.py 的 A11 驗證（正典）；各 source 的用法、
  # kind 對照見 docs/pipelines/evaluation.md。
  # 可填欄位（值的合法集合）：
  #   kind            ∈ {model_version, external_hive}                （必填）
  #   label           任意字串（report_comparison.html 顯示名）        （必填）
  #   model_version   字串                                  （kind=model_version 必填）
  #   source          ∈ {enriched_eval_predictions, ranked_predictions,
  #                      training_eval_predictions}  （kind=model_version 選填，預設第一個）
  #   table           Hive-qualified 字串                   （kind=external_hive 必填）
  #   columns         我們的欄 → 外部欄名 map                （kind=external_hive 必填）
  #   prod_mapping    外部 prod_name → 我們的 prod_name（N:1，右側須 A6 已知值）（同上必填）
  #   unmapped_policy ∈ {fail, drop}                       （kind=external_hive，預設 fail）
  compare_sources: {}
  # 範本（拿掉 # 即啟用；★ 所有值由你填）：
  #compare_sources:
  #  v_prev:                                  # kind=model_version：另一個同框架版本
  #    kind: model_version
  #    label: "v_prev (上一版)"
  #    model_version: "2026-01-31_abcdef12_34567890"
  #    source: enriched_eval_predictions      # 選填，合法值見上
  #  ext_proj_x:                              # kind=external_hive：外部 Hive 表
  #    kind: external_hive
  #    label: "External Project X"
  #    table: other_project.predictions
  #    # 左邊的 key 是 schema 角色解析出的欄名（time/entity 各欄/item/score），
  #    # 下面用的是預設 schema；改過 schema.columns 就要換成新欄名，否則 A11 擋下。
  #    columns: {cust_id: customer_id, snap_date: as_of_date, prod_name: item_code, score: pred_score}
  #    prod_mapping: {ext_fund_a: fund_stock, ext_fund_b: fund_bond}
  #    unmapped_policy: fail                   # fail（預設）| drop
