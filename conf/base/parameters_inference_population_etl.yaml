# ★＝換成你自己的資料時一定要改的鍵（值是示例資料專屬的）；README「一定要設的鍵」列的就是這些。
# Inference 推論母體 ETL pipeline 配置
# 上游依賴 feature_etl 產出的 feature_concat。對應 training 端的 sample_pool，
# 但 grain 為 (snap_date, cust_id) 且時間切點為 inference 當期 snap_date。

inference_population_etl:
  # 沒給 --target-dates 時用這裡的日期，例 ["2025-01-31"]（日期要加引號，否則 YAML 會讀成日期物件）；
  # 兩邊都沒有就報錯。
  target_dates: []
  # 每次執行的 SQL 存到 <這裡>/<run_id>/<target_date>/<table>.sql；不想存就刪掉這行。
  rendered_sql_dir: data/rendered_sql

  variables:
    target_db: "ml_recsys"  # ★換成你的 Hive database 名稱

  source_checks: {}

  # ★Output tables — sql_file／primary_key／partition_by 皆為範例資料專屬，整段換成你自己的來源表定義
  tables:
    - name: inference_population
      sql_file: inference_population/inference_population.sql
      partition_by:
        snap_date: DATE
      primary_key: [snap_date, cust_id]
      quality_checks:
        max_duplicate_key_ratio: 0.0

  audit:
    database: "${target_db}"
    table: etl_audit_log
