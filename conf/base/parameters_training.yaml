# model_version scope：只有「定義模型」的子集會被 hash 進 model_version——亦即
# `training:` 區塊扣掉純 logging / threading 的 `verbosity`、`log_period`、
# `num_threads`。下方的 `spark:`、`mlflow:`、`cache:` 區塊「不」影響
# model_version。Single source of truth：src/recsys_tfb/core/versioning.py ::
# _model_version_payload。
spark:
  app_name: recsys_tfb-training
  # spark.executor.memory: 16g
  # spark.executor.cores: 4
  # spark.driver.memory: 8g

# ops block（與 spark:／mlflow:／cache: 同層）——不影響 model_version。
# HPO 與其後的 finalize/calibrate 全是 driver-local，Spark 從 cache_* 節點結束到
# predict_and_write_test_predictions 之間完全閒置，可能數小時。閒置的 application
# 會被叢集端回收，context 在 JVM 端死掉，之後寫 Hive 就撞 stopped SparkContext。
# 改成主動釋放，由下一個用到 Spark 的節點依 canonical configs 重建。
#
# 診斷用途：設為 false 時 session 全程存活（重建修復仍兜底），HPO 期間若真的被叢集
# 回收，log 會出現 spark_context_dead 事件，其 seconds_since_last_use 貼合 HPO 窗口
# 即證實「閒置回收」。true（預設）時窗口內沒有 session 可被殺，該事件不會為此而發。
spark_lifecycle:
  release_during_hpo: true

training:
  algorithm: lightgbm          # ∈ {lightgbm}（ADAPTER_REGISTRY 已註冊者；未知會 raise 列出可用）
  algorithm_params:
    objective: binary          # pointwise；要 LTR 改 {lambdarank, rank_xendcg}（見下方 LTR 說明）
    metric: binary_logloss     # binary→LightGBM metric；LTR→{ndcg, map}（留空預設 ndcg，A7 驗）
    verbosity: -1
    # log_period：0 表示完全靜默；> 0 時，訓練過程每 N 個 boosting round 印一次
    # val metric（HPO 每個 trial + 最終 refit 都會印）。由 LightGBMAdapter 在
    # 進 lgb.train 前 pop 掉，並非 LGB 原生 param。
    log_period: 100
    # num_threads：釘定固定的 core count，避免 LightGBM fallback 到
    # OMP_NUM_THREADS=1 或被 cgroup 限縮的 cpu_count default。
    num_threads: 4
    # --- Learning-to-rank（Phase 1）--------------------------------------
    # 要訓練 ranking model，請改 objective 與 ranking metric，例如：
    #   objective: lambdarank      # 或 rank_xendcg
    #   metric: ndcg               # ranking metric ∈ {ndcg, map}；可省略（A7 預設 ndcg）
    #   ndcg_eval_at: [5, 10]      # NDCG 截斷層級（選填）
    # 每個 query 的 group 來自 schema.columns.time + entity
    # （預設 snap_date + cust_id），會自動帶進 train/train_dev binaries 與 HPO
    # early stopping。ranking objective 配非 ranking metric 在 CLI 入口會被擋
    # 下（consistency A7）。不論訓練 objective 為何，evaluation 永遠是
    # per-customer mAP。
    #
    # 換 objective 之前先讀懂這三件事。**下面每一個數字都量在本機合成資料上，
    # 不代表生產；幅度不可跨環境搬，只有方向與同號性可引用。** 實測、腳本與
    # 這些數字的來源標記：docs/notes/2026-09-07-ltr-objective-support.md。
    #
    # (a) 兩個 LTR objective 對「整組沒有正例的 query group」的處理**相反**。
    #     lambdarank 在這種 group 上梯度貢獻精確為零（實測 LightGBM 4.6.0：
    #     1 棵樹、0 個 split、預測零變異），所以建 train / train_dev 的 lgb
    #     binary 時會把它們丟掉；rank_xendcg 會學（目標分布在 label 全 0 時是
    #     隨機榜單，實測 50 棵樹全都有 split），所以一列不丟；binary 也一列不
    #     丟。這由 objective 推導，**沒有對應的 config 鍵**——真實來源是
    #     core/group_utils.py 的 objective_drops_zero_positive_groups。
    #     濾了幾個 group、幾列，寫進 log 與 group_filter_report.json
    #     （manifest 的 extra_metadata.group_filter）。
    #
    # (b) rank_xendcg 的 ndcg 讀數會**虛高**，而且在有權重時可能**超過 1**。
    #     LightGBM 把零正例 group 記為滿分而不是 0。權重全為 1 時讀數是
    #       NDCG_未濾 = f × 1.0 + (1 − f) × NDCG_已濾      （f = 零正例 group 佔比）
    #     實測（合成資料，f = 0.30）等式收在 3.33e-16。**看到 0.99 不代表模型
    #     強**，代表 f 很高。
    #
    #     **權重不是 1 時，零正例 group 的貢獻是 1/w̄（w̄ = 該 group 的平均列
    #     權重），不是 1.0**——LightGBM 用未加權的 1.0 當分子、query 權重和當
    #     分母。實測：整份權重 0.5 → 讀數 2.0；0.2632 → 3.80。這正好會踩到：
    #     early stopping 的 valid set 是 train_dev，它的 .bin 帶 per-row
    #     weight；而下方 sample_weights 的雙因子公式給冷門 item 的負例
    #     w_neg = A·v（v < 1），零正例 group 整組都是負例列 → w̄ < 1 → 讀數往上
    #     跑。本機 sample_weights 是 {}（權重全 1），**生產有值**。
    #
    #     early stopping 不受影響：不論加不加權，未濾的讀數都是已濾讀數的一個
    #     正斜率仿射轉換，對 iteration 取 argmax 不變（實測三條曲線 argmax 相同）。
    #     **但這條保證依賴 early stopping 的 min_delta = 0**（現行取 LightGBM
    #     預設，adapter 沒有傳這個參數）；日後若有人設 min_delta > 0，壓縮係數
    #     會改變門檻的實際嚴格度。
    #
    # (c) 切 objective 會 bump model_version（objective 在被 hash 的 training:
    #     區塊內），而且模型**不會**與濾之前逐位元相同。梯度貢獻為零是精確的，
    #     但 min_data_in_leaf 用列數計數、分箱邊界隨資料分布改變，兩個間接效應
    #     都會讓模型不同（都是 LightGBM 既有行為，不是 bug）。所以切換後不應
    #     期待分數與濾之前一致。
    #
    # 下方 sample_weights 的雙因子公式預設 pointwise loss，在 LTR 下只有方向
    # 成立、校準目標 t 沒有對應物——適用範圍見
    # docs/operations/user-guides/sampling-overrides-editor.md §3.6。
    # --------------------------------------------------------------------
  calibration:
    enabled: true              # bool；★ 要把 score 當機率時才開
    method: sigmoid            # ∈ {isotonic, sigmoid}
  # --- Composite-key sample weights（模型層調權，如冷門產品 boost）---
  # sample_weight_keys: weight key 由哪些欄位組成（順序＝ "|" 串接順序），與
  #   dataset.sample_group_keys 對稱（可不同）。預設 [prod_name]＝直接對產品調權。
  #   ★每欄必須 ∈ identity(snap_date,cust_id,prod_name) ∪ {label} ∪
  #   dataset.carry_columns ∪ dataset.prepare_model_input.categorical_columns（A9a 驗）。
  #   類別欄填人類可讀字串即可（runtime 把 model_input 裡的 code 解回類別值再比對）；
  #   機制與 edge case 見
  #   docs/pipelines/training.md。可用 scripts/sampling_overrides_editor.py 從實際資料推導
  #   （雙因子地板＋注意力權重）；概念框架、公式與範例見
  #   docs/operations/user-guides/sampling-overrides-editor.md。
  sample_weight_keys:
    - prod_name
  # sample_weights: ★key ＝ sample_weight_keys 值用 "|" 串接、value ＝ 任意正數
  #   （>1 boost、<1 down-weight）。稀疏：只列 != 1.0 的組，其餘 = 1.0。
  #   只作用於 train/train_dev（val/calibration/evaluation 不加權）。打錯/不存在的值
  #   → 不中（weight 1.0），記入 manifest.json 的 sample_weight.unmatched_keys。
  #   A9b 驗 key 段數、A9c 驗 product 分量；改 keys 或此表 bust model_version、
  #   不動 train_variant_id。
  #   範例（sample_weight_keys: [cust_segment_typ, prod_name]）：
  #     "mass|ccard_ins": 2.0
  #     "affluent|fund_mix": 0.7
  sample_weights: {}
  # HPO scoring objective (switchable). Routed by tune_hyperparameters via
  # _hpo_score; independent of algorithm_params.objective (the LightGBM
  # learning objective).
  #   mean_ap            — per-(snap_date,cust_id) query mAP, query-equal-weight
  #                        (frequent products dominate via positive frequency).
  #   macro_per_item_map — evaluation's macro_avg.by_item.map_attr@all: per-item
  #                        attributed mAP, macro-averaged over products
  #                        (every product equal weight; cold products count).
  # NOTE: this key is inside the model_version-hashed training: block, so
  # changing it is a deliberate one-time model_version bump.
  hpo_objective: macro_per_item_map   # ∈ {mean_ap, macro_per_item_map}
  n_trials: 20
  num_iterations: 500
  early_stopping_rounds: 50
  # HPO 之後最終模型的處理策略：
  #   hpo_best       — 直接沿用 HPO best-trial 的 adapter（預設）。
  #   refit_on_full  — 在 train + train_dev concat 後重訓，
  #                    num_iterations = best_iteration、不做 early stopping。
  final_model_strategy: hpo_best   # ∈ {hpo_best, refit_on_full}
  # --- Training-stage feature selection（不重建 dataset、retrain 時排除多餘特徵）---
  #   ★exclude — 要丟掉的 feature 名稱 list（須 ∈ 該 dataset 的 feature_columns；
  #              不可含 schema.item，A14 fail-loud 擋下）。空/省略＝完全不啟用。
  #   啟用只 bump model_version（不動 base/train_variant），完整清單寫進 manifest.json；
  #   機制（select_features / preprocessor_view / inference 對齊 / .bin 快取）見
  #   docs/pipelines/training.md。
  feature_selection:
    exclude: []
  # search_space：ParamSpec map 的有序 list（declarative HPO, Phase 2）。
  # `name` 同時是 Optuna suggest name 與 LightGBM param key。
  # type ∈ {int, float, categorical}。int/float：low、high（可選 step、log）；
  # categorical：choices。`when` / expression bounds 屬於 Phase 3，現階段傳入
  # 會被 consistency A8 fail-loud 擋下。NOTE：從舊 dict 形式遷移過來會重排
  # 被 hash 的 `training:` 區塊——這是經過決定、接受的一次性 model_version
  # bump（見 versioning.py）。
  search_space:
    - name: learning_rate
      type: float
      low: 0.001
      high: 0.1
      log: true
    - name: num_leaves
      type: int
      low: 4
      high: 64
    - name: max_depth
      type: int
      low: 3
      high: 8
    - name: min_child_samples
      type: int
      low: 5
      high: 100
    - name: subsample
      type: float
      low: 0.6
      high: 1.0
    - name: colsample_bytree
      type: float
      low: 0.6
      high: 1.0

mlflow:
  experiment_name: recsys_tfb
  tracking_uri: "${env.MLFLOW_TRACKING_URI|mlruns}"
  # log_experiment 是 best-effort sink：tracking server 不可用或版本不相容
  # （如 client 3.x 對舊 server 呼叫 /api/2.0/mlflow/logged-models 收到 404）時，
  # 預設記 warning 後讓 training 跑完。設 true 則 MLflow 失敗即中斷（CI/嚴格環境用）。
  strict: false

# Driver-local parquet cache：materialize 後的 model inputs，重跑時可跳過 Hive
# scan。由 base_dataset_version / train_variant_id / calibration_variant_id 三
# 層 key 決定；`test_model_input` 例外——它**一個 test 月份一個目錄**
# （test_months/<YYYYMMDD>/，各自持有自己的 _SUCCESS）。目錄名只宣稱它自己那
# 一個月，名字與內容不會分歧。
# ⚠ 「加一個月只複製那一個月」要等 test 日期退出 base_dataset_version
# （ADR-0001）之後才成立：在那之前加月份仍會翻號，路徑第一層就換掉，所有月份
# 照樣重抄。本層是為那一刻先架好的護欄——順序反了會出現「加了月份、cache 命中
# 舊資料、新月份從未被 predict、而且不報錯」（見 ADR-0003）。
# 另一個效果：設定列了某月但來源表沒有（典型：加了月份卻忘了先跑 dataset），
# 逐月複製的 glob 零命中即 raise FileNotFoundError——這道 fail-loud 是機制自帶
# 的，不需要另外寫覆蓋檢查。
# `cache.root` 是 cache 路徑的唯一真實來源，training/steps/local_cache.py 的
# resolve_cache_path（存在性檢查）與 populate_cache_from_hive（hadoop fs
# copyToLocal 目的地）都從這裡讀。persistence 由 training/nodes.py 的 5 個
# cache_*_model_input node 各自負責，不經 catalog dataset。所有環境都會寫
# parquet 到 disk 並在 DAG 中以 ParquetHandle 串接；dev/test 用一個臨時的
# cache.root。
cache:
  root: data/recsys_cache

# 訓練診斷產物（特徵統計 / 原生 importance / SHAP）。
# 刻意放 top-level（與 mlflow / cache 同層）：compute_model_version 只雜湊
# training: block，故此 block 不影響 model_version（見 test_versioning）。
diagnostics:
  feature_stats:
    enabled: true
    sample_rows: 500000
    high_null_threshold: 0.5
  feature_importance:
    enabled: true
  gain_ledger:
    enabled: true   # 結構層 Gain 帳本（診斷項目 8）；判讀見 docs/pipelines/evaluation-diagnosis.md §12
  shap:
    enabled: true
    background: global   # global | per_item（per_item＝背景取該 item 子母體，interventional；成本較高）
    sample_rows: 2000       # SHAP 抽樣列數；過慢或 driver memory 不足時先降低
    top_k: 30               # JSON/profile 顯示的特徵數；通常 20~30 足夠審核
    min_rows_per_item: 30   # item 抽樣低於此值會標記 low_coverage，解讀需保守
    max_budget: 4000000     # sample_rows * n_trees 超過此值時自動降低抽樣
    # per-item SHAP 解讀設定（top-level ops 診斷，不影響 model_version）。
    profile_positive: true          # 同時計算 label==1 採購者 profile，對照全體候選
    positive_min_rows: 20           # 採購者樣本不足時 top_features_positive=null
    positive_sample_per_item: 30    # 正例 profile 每 item 針對 label==1 抽樣的目標數；應 >= positive_min_rows，否則永遠無法達覆蓋門檻
    divergence_metric: jaccard_topk # item top features vs 全域 top features；可用 spearman
    divergence_top_k: 15            # 偏離度比較用 top-k，通常小於或等於 top_k
    per_item_beeswarm: true         # item 很多時可關閉，減少圖片數與執行時間
    # 象限診斷（P2b:TP/FP/FN/TN top@1;per-(item×象限) profile → per_quadrant.json）
    quadrant_enabled: true          # 關閉則不跑象限選樣/profile
    quadrant_top_k_decision: 1      # 象限「判正」名次界線（top@K）
    quadrant_sample_per_cell: 30    # 每 (item×象限) profile 抽樣目標數
    quadrant_min_rows: 10           # 某格 < 此 → low_coverage
    case_top_k: 15                  # 單列 case 案例圖顯示的特徵數（|SHAP| 最大的前 N）
  # HPO 搜尋診斷（放此非 training:，故不進 model_version hash）。每次 HPO 後 best-effort
  # 寫 diagnostics/hpo/：hpo_trials.json（稽核）+ hpo_summary.json（收斂/邊界/重要性）+ 5 張圖。
  # patience/boundary_* 是啟發式提示、非保證，判讀見 spec 2026-07-15-hpo-search-diagnostics-design.md §7。
  hpo_search:
    enabled: true        # false → 整包跳過（連稽核 JSON 都不寫）
    patience: 10         # 連續 N 個完成 trial 未進步 → plateau 提示（答「要不要再繼續 trial」）
    boundary_hi: 0.98    # 最佳值相對位置 >= 此 → 貼上界，建議放寬（答「search range 要不要調」）
    boundary_lo: 0.02    # 相對位置 <= 此 → 貼下界，建議放寬

# HPO 崩潰復原開關（ops 旗標，刻意放頂層不影響 model_version）。
# true（預設）：tune_hyperparameters 持久化 Optuna study + 每次刷新最佳 checkpoint
# 模型到 data/models/_hpo/<search_id>/，crash 後重跑只補跑剩餘 trial。
# false：退回純記憶體、不落地（debug 用）。詳見 docs/pipelines/training.md §7.3。
hpo_checkpointing: true
