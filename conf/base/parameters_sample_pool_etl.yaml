# ★＝換成你自己的資料時一定要改的鍵（值是示例資料專屬的）；README「一定要設的鍵」列的就是這些。
# Sample pool ETL pipeline 配置
# 上游依賴 feature_etl 產出的 feature_concat 與 label_etl 產出的
# label_{ccard,exchange,fund}。未來如需做跨 DAG 新鮮度檢查，可加在
# ${target_db}.feature_concat 與三張 label table 的 source_checks。

sample_pool_etl:
  # 沒給 --target-dates 時用這裡的日期，例 ["2025-01-31"]（日期要加引號，否則 YAML 會讀成日期物件）；
  # 兩邊都沒有就報錯。
  target_dates: []
  # 每次執行的 SQL 存到 <這裡>/<run_id>/<target_date>/<table>.sql；不想存就刪掉這行。
  rendered_sql_dir: data/rendered_sql

  variables:
    target_db: "ml_recsys"  # ★換成你的 Hive database 名稱

  # 上游 source table 的新鮮度 / schema 檢查（ETL 執行前先跑）
  source_checks: {}

  # ★Output tables — 執行順序 = list 順序（sql_file／primary_key／partition_by 皆為範例資料專屬，整段換成你自己的來源表定義）
  tables:
    - name: sample_pool
      sql_file: sample_pool/sample_pool.sql
      partition_by:
        snap_date: DATE
      primary_key: [snap_date, cust_id, prod_name]
      quality_checks:
        max_duplicate_key_ratio: 0.0

  # Audit Hive table（feature/label/sample_pool ETL 共用）
  audit:
    database: "${target_db}"
    table: etl_audit_log
