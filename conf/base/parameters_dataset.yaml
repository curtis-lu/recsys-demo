dataset:
  # --- Train 月底 snap_date list ---
  # 顯式列出（避免上游 cadence 變動時 silently 吞下，符合 ML lineage 慣例）
  # 產生：pd.date_range(start, end, freq="ME").strftime("%Y-%m-%d").tolist()
  train_snap_dates:
    - "2025-01-31"
    - "2025-02-28"
    - "2025-03-31"
    - "2025-04-30"
    - "2025-05-31"
    - "2025-06-30"
    - "2025-07-31"
    - "2025-08-31"
    - "2025-09-30"
    - "2025-10-31"

  # --- 抽樣 ---
  sample_ratio: 1.0      # float [0,1]；★ 預設抽樣比例（決定性 hash，同 seed→同結果）
  sample_group_keys:     # ★分層維度（你的欄；多欄用 "|" 串成 override / weight key）
    - "cust_segment_typ"
    - "prod_name"
    - "label"
  sample_ratio_overrides:
  # 多欄位 sample_group_keys 時，用 "|" 組合序列化為 key
  # 範例（sample_group_keys: [cust_segment_typ, prod_name, label]）：
    "mass|ccard_ins|0": 0.5
    "affluent|ccard_ins|0": 0.9
    "hnw|ccard_ins|0": 0.8
  # 未指定的組合用預設 sample_ratio

  # --- Carry columns（沿用欄位）---
  # ★非 identity、要從 sample_pool 帶進 train/train_dev/calibration model_input
  # parquet 的欄位清單（供 training.sample_weights 分群；權重實際只套 train/train_dev）。
  # 寬鬆超集策略：一次列足想用的維度，weight 表只取需要的子集 → 改 weight 不需
  # 重產 dataset。⚠改此清單會 bust base_dataset_version（parquet schema 變、整批重算）。
  #
  # ★配對規則：此處的欄若**也存在於 feature_table**，必須同時列進下面的
  #   prepare_model_input.drop_columns（cust_segment_typ 正是這個情況——兩處都有它是
  #   刻意的，不是矛盾，別「順手修掉」）。否則 build_model_input 的 join 兩側各帶一份
  #   同名欄，Spark 會報 `Reference 'x' is ambiguous`。反向修法（從 carry_columns 拿掉）
  #   也合法：差別是保 carry 棄特徵 vs 保特徵棄 carry。不變量 B7 會在 dataset 第一個
  #   node 擋下並同時給出兩種修法。identity 欄與 label 不受此規則約束。
  #   詳見 docs/adr/0004-carry-drop-columns-intersection.md
  carry_columns:
    - cust_segment_typ

  # --- Train / Train-dev（共用日期，按 entity ratio 切分）---
  train_dev_ratio: 0.1

  # 切分單位：train/dev 切分時，「同一個誰」必須整批落在同一邊。
  # 預設（不宣告）＝完整 schema.entity，也就是一個 query group 的擁有者。
  # 合法值＝schema.entity 的非空子集（不變量 A29 在 CLI 進入點秒級擋下）。
  # 什麼時候要動它：你的洩漏單位比 query group 粗。例如 entity 是
  # [cust_id, acct_id]，而同一客戶的多個帳戶不得跨切分邊界 → 填 [cust_id]。
  # ⚠ 改此鍵會翻 train_variant_id（train／train_dev 重算），
  #   base_dataset_version 不動（val／test 產物完全不受影響）。
  # 保持註解狀態＝維持預設；一旦寫成實鍵就會翻 train_variant_id，即使值等同預設。
  # train_split_keys: ["cust_id"]

  # --- Calibration（optional）---
  enable_calibration: true
  calibration_snap_dates: ["2025-11-30"]
  calibration_sample_ratio: 1.0
  calibration_sample_ratio_overrides: {}
  # 格式同 sample_ratio_overrides，用 "|" 組合序列化為 key
  # 範例：{"mass|fund_mix": 0.8}
  # 未指定時 calibration 使用 calibration_sample_ratio 作為預設

  # --- Validation（驗證集）---
  val_snap_dates:
    - "2025-12-31"
  val_sample_ratio: 1.0

  # 抽樣單位：val_sample_ratio < 1 時，抽中的 entity 會被整批保留。
  # 預設（不宣告）＝完整 schema.entity；合法值同 train_split_keys（不變量 A29）。
  # ⚠ 改此鍵會翻 base_dataset_version——val 產物只由這一個 ID 分割，
  #   不翻它就會拿著新的抽樣單位靜默沿用舊的 val parquet。
  #   代價是 preprocessor／val／test 整批重算，train 系列連坐。
  # 保持註解狀態＝維持預設；為什麼這兩件事要用兩把尺而不是一把，見
  #   docs/adr/0016-split-unit-declared-by-two-keys.md
  # val_sample_keys: ["cust_id"]

  # --- Test（測試集）---
  test_snap_dates:
    - "2026-01-31"

  prepare_model_input:
    drop_columns:
      - "snap_date"
      - "cust_id"
      - "label"
      - "apply_start_date"
      - "apply_end_date"
      - "cust_segment_typ"
    categorical_columns:
      - "prod_name"
      - "gender"
      - "risk_attr"
      - "education_level"
      - "marital_status"
      - "channel_preference"
