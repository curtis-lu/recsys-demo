# conf/dev/ 疊在 conf/base/ 上面：同名的鍵以這裡為準，沒寫的鍵沿用 base（逐鍵合併，
# 所以每個條目只要寫 table 一行）。
#
# 這份檔只做一件事：幫框架自己寫的 17 張 Hive 表加上前綴 recsys_prod_（prod＝產品），
# 示範怎麼跟同一個 database 裡的其他表分開命名。
# - 前綴可以換成你自己的；不想要前綴就刪掉這份檔，改用 base 的表名。也可以不動表名，
#   改 parameters.yaml 的 hive.db 換一個 database。
# - 換了表名，框架就讀寫新名字的那張表。舊表不會被搬過去，也不會被刪。
# - 來源表（feature_table／label_table／sample_pool／inference_population，以及選用的
#   candidate_feature_table）不在這裡：它們的名字由你的上游決定，不是框架決定的。
# - 這份檔是框架附的：base 新增一張框架寫的表時，升級會在這裡補一條（見
#   docs/operations/user-guides/using-a-release.md §5）。

# --- dataset ---
val_keys:
  table: recsys_prod_val_keys

test_keys:
  table: recsys_prod_test_keys

val_model_input:
  table: recsys_prod_val_model_input

test_model_input:
  table: recsys_prod_test_model_input

sample_keys:
  table: recsys_prod_sample_keys

train_keys:
  table: recsys_prod_train_keys

train_dev_keys:
  table: recsys_prod_train_dev_keys

preprocessed_feature_table:
  table: recsys_prod_preprocessed_feature_table

train_model_input:
  table: recsys_prod_train_model_input

train_dev_model_input:
  table: recsys_prod_train_dev_model_input

# --- training ---
training_eval_predictions:
  table: recsys_prod_training_eval_predictions

# --- evaluation ---
enriched_eval_predictions:
  table: recsys_prod_enriched_eval_predictions

popularity_period_counts:
  table: recsys_prod_popularity_period_counts

# --- inference ---
inference_population_features:
  table: recsys_prod_inference_population_features

unranked_predictions:
  table: recsys_prod_unranked_predictions

ranked_staging:
  table: recsys_prod_ranked_staging

ranked_predictions:
  table: recsys_prod_ranked_predictions
