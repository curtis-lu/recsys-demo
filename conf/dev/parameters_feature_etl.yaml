# 表名加前綴 recsys_prod_。tables 照抄 conf/base/ 的同名檔，只改 name 與 depends_on（清單只能整段覆蓋）。
feature_etl:
  tables:
    - name: recsys_prod_feature_aum
      sql_file: feature/feature_aum.sql
      partition_by:
        snap_date: DATE
      primary_key: [snap_date, cust_id]

    - name: recsys_prod_feature_sav
      sql_file: feature/feature_sav.sql
      partition_by:
        snap_date: DATE
      primary_key: [snap_date, cust_id]

    - name: recsys_prod_feature_ccard
      sql_file: feature/feature_ccard.sql
      partition_by:
        snap_date: DATE
      primary_key: [snap_date, cust_id]

    - name: recsys_prod_feature_info
      sql_file: feature/feature_info.sql
      partition_by:
        snap_date: DATE
      primary_key: [snap_date, cust_id]

    - name: recsys_prod_feature_concat
      sql_file: feature/feature_concat.sql
      partition_by:
        snap_date: DATE
      primary_key: [snap_date, cust_id]
      depends_on: [recsys_prod_feature_aum, recsys_prod_feature_sav, recsys_prod_feature_ccard, recsys_prod_feature_info]

    - name: recsys_prod_feature_table
      sql_file: feature/feature_table.sql
      partition_by:
        snap_date: DATE
      primary_key: [snap_date, cust_id]
      quality_checks:
        max_duplicate_key_ratio: 0.0
      depends_on: [recsys_prod_feature_concat]

  audit:
    table: recsys_prod_etl_audit_log
