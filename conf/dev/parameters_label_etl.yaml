# 表名加前綴 recsys_prod_。tables 照抄 conf/base/ 的同名檔，只改 name 與 depends_on（清單只能整段覆蓋）。
label_etl:
  tables:
    - name: recsys_prod_label_ccard
      sql_file: label/label_ccard.sql
      partition_by:
        prod_name: STRING
        snap_date: DATE
      primary_key: [snap_date, cust_id, prod_name]
      quality_checks:
        max_duplicate_key_ratio: 0.0

    - name: recsys_prod_label_exchange
      sql_file: label/label_exchange.sql
      partition_by:
        prod_name: STRING
        snap_date: DATE
      primary_key: [snap_date, cust_id, prod_name]
      quality_checks:
        max_duplicate_key_ratio: 0.0

    - name: recsys_prod_label_fund
      sql_file: label/label_fund.sql
      partition_by:
        prod_name: STRING
        snap_date: DATE
      primary_key: [snap_date, cust_id, prod_name]
      quality_checks:
        max_duplicate_key_ratio: 0.0

    - name: recsys_prod_label_table
      sql_file: label/label_table.sql
      partition_by:
        prod_name: STRING
        snap_date: DATE
      primary_key: [snap_date, cust_id, prod_name]
      depends_on: [recsys_prod_label_ccard, recsys_prod_label_exchange, recsys_prod_label_fund]
      quality_checks:
        max_duplicate_key_ratio: 0.0

  audit:
    table: recsys_prod_etl_audit_log
