<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.26.0/plotly.min.js"></script>
<script>
(function(){
"use strict";

/* ---------- 示例資料（決定性亂數，每次打開都一樣） ---------- */
const TIMES=["2024-01-31","2024-02-29","2024-03-31","2024-04-30","2024-05-31","2024-06-30","2024-07-31","2024-08-31","2024-09-30","2024-10-31","2024-11-30","2024-12-31","2025-01-31","2025-02-28"];
const T=TIMES.length, LATEST=T-1;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd=mulberry32(20261015);
const jit=a=>1+(rnd()-0.5)*a;
const ROWS=TIMES.map((_,i)=>1182340+i*3127+((i*7)%5)*389);
const smallPsi=()=>0.002+rnd()*0.02;

/* 判斷標準：對應設定檔 thresholds 區塊 */
const TH={null_ratio:0.99,precision_max_abs:100000,psi:0.25,tail_ratio:10,tail_log_ratio:1,corr:0.95};
const slog=x=>Math.sign(x)*Math.log1p(Math.abs(x));
const INT_EXACT=16777216; /* float32 能一個不差存下來的最大整數 2^24，固定不調 */

const F=[];
function rDec(v){return Math.abs(v)<100?Math.round(v*10000)/10000:Math.round(v*100)/100;}
function addNum(name,dtype,o){
  const f={name,kind:"num",dtype,dec:!!o.dec,null:[],min:[],max:[],q:[],psi:[],constAt:[],constVals:null};
  const r=o.dec?rDec:Math.round;
  for(let t=0;t<T;t++){
    const nl=o.nullFn?o.nullFn(t):Math.min(1,(o.nul||0)*jit(0.12));
    f.null.push(nl);
    if(nl>=1){f.q.push(null);f.min.push(null);f.max.push(null);f.constAt.push(false);f.psi.push(o.psiFn?o.psiFn(t):null);continue;}
    const cv=o.constAtFn?o.constAtFn(t):null;
    let q,mx,mn;
    if(cv!=null){q=[cv,cv,cv,cv,cv];mx=cv;mn=cv;}
    else if(o.qFn){q=o.qFn(t);mx=o.maxFn?o.maxFn(t,q):o.max;mn=o.min!==undefined?o.min:0;}
    else{
      const s=o.scale*(o.mult?o.mult(t):1)*jit(0.03);
      q=(o.shape||[0.01,0.35,0.8,1.6,7]).map(k=>k*s);
      mx=o.maxFn?o.maxFn(t,q):q[4]*(o.maxMult||2.3)*jit(0.25);
      mn=o.minFn?o.minFn(t):(o.min!==undefined?o.min:0);
    }
    q=q.map(r);
    const mxr=r(mx), oddify=v=>(!o.dec&&Math.abs(v)>INT_EXACT&&v%2===0)?v+1:v;
    f.q.push(q);f.max.push(oddify(mxr));f.min.push(r(mn));f.constAt.push(cv!=null);
    f.psi.push(t===0?0:(o.psiFn?o.psiFn(t):smallPsi()));
  }
  addTails(f);F.push(f);return f;
}
function addTails(f){
  f.tailHi=[];f.tailLo=[];f.logHi=[];f.logLo=[];
  for(let t=0;t<T;t++){
    const q=f.q[t];
    if(!q||q[4]===q[0]){f.tailHi.push(null);f.tailLo.push(null);f.logHi.push(null);f.logLo.push(null);continue;}
    const w=q[4]-q[0], wl=slog(q[4])-slog(q[0]);
    f.tailHi.push((f.max[t]-q[4])/w);f.tailLo.push((q[0]-f.min[t])/w);
    f.logHi.push((slog(f.max[t])-slog(q[4]))/wl);f.logLo.push((slog(q[0])-slog(f.min[t]))/wl);
  }
}
function addConst(name,dtype,vals,dec){
  const f={name,kind:"num",dtype,dec:!!dec,null:TIMES.map(()=>0),min:vals.slice(),max:vals.slice(),
    q:vals.map(v=>[v,v,v,v,v]),psi:TIMES.map(()=>null),constAt:TIMES.map(()=>true),constVals:vals.slice()};
  addTails(f);F.push(f);
}
function addStr(name,o){
  const f={name,kind:"str",dtype:"string",cats:o.cats,null:[],shares:[],psi:[],q:TIMES.map(()=>null),max:TIMES.map(()=>null),min:TIMES.map(()=>null),
    constAt:TIMES.map(()=>!!o.constVal),constVals:o.constVal?TIMES.map(()=>o.constVal):null};
  for(let t=0;t<T;t++){
    f.null.push(Math.min(1,(o.nul||0)*jit(0.12)));
    f.shares.push(o.sharesFn(t));
    f.psi.push(o.constVal?null:(t===0?0:(o.psiFn?o.psiFn(t):0.002+rnd()*0.015)));
  }
  addTails(f);F.push(f);return f;
}

addNum("bal_avg_1m","double",{dec:true,scale:82000,maxMult:36,nul:0.004});
addNum("bal_avg_3m","double",{dec:true,scale:83500,maxMult:34,nul:0.004});
addNum("bal_avg_6m","double",{dec:true,scale:84800,maxMult:33,nul:0.004});
addNum("dep_bal","bigint",{scale:61000,maxMult:41,minFn:t=>t===4?-20000003:0});
addNum("fund_aum","decimal(18,2)",{dec:true,scale:310000,maxMult:22,nul:0.70});
addNum("loan_bal","bigint",{scale:900000,shape:[0.05,0.5,0.9,1.4,3.2],maxFn:(t,q)=>q[4]*1.35*jit(0.1),nul:0.85});
addNum("loan_rate","double",{dec:true,qFn:()=>[0.012,0.021,0.026,0.033,0.068].map(v=>v*jit(0.02)),max:0.18,min:0.005,nul:0.85});
addNum("txn_cnt_1m","int",{scale:9,shape:[0,0.45,1,1.9,6],maxFn:(t,q)=>t===6?100000:q[4]*2.4*jit(0.25)});
addNum("txn_cnt_3m","int",{scale:27,shape:[0,0.45,1,1.9,6],maxMult:2.2});
addNum("txn_amt_1m","bigint",{scale:21000,maxMult:18});
addNum("txn_amt_3m","bigint",{scale:63000,maxFn:(t,q)=>t===12?25000001:q[4]*17*jit(0.25)});
addNum("card_spend_1m","bigint",{scale:9800,maxMult:15,mult:t=>t>=11?100:1,psiFn:t=>t>=11?[4.81,4.93,4.77][t-11]:smallPsi()});
addNum("card_spend_3m","bigint",{scale:29500,maxMult:14,mult:t=>t===11?34:t===12?67:t===13?100:1,psiFn:t=>t>=11?[1.24,2.93,4.62][t-11]:smallPsi()});
addNum("salary_in_1m","bigint",{scale:46000,shape:[0.05,0.6,0.95,1.5,6.8],maxMult:8,nul:0.31});
addNum("pt_bonus","int",{scale:1200,shape:[0,0.2,0.8,1.9,6],maxMult:3,constAtFn:t=>t===6?0:null,psiFn:t=>t===6?5.83:smallPsi()});
addNum("age","int",{qFn:()=>[21,33,44,56,79],maxFn:t=>t===9?999:99,min:18});
addNum("tenure_m","int",{qFn:t=>[1,22+t*0.1,61+t*0.2,118,302],max:471,min:0});
addNum("prod_cnt","int",{qFn:()=>[1,1,2,3,7],max:14,min:1});
addNum("credit_score","int",{qFn:()=>[412,598,671,733,812],max:850,min:300,nul:0.05});
addNum("limit_util","double",{dec:true,qFn:()=>[0,0.04,0.19,0.47,0.98],max:1.43,min:0});
addNum("app_days_1m","int",{qFn:t=>[0,2+0.25*t,8+0.6*t,17+0.5*t,30],max:31,min:0,psiFn:t=>0.024*t+(rnd()-0.5)*0.006});
addNum("login_cnt_1m","int",{scale:6,shape:[0,0.4,1,2,7],maxMult:3});
addNum("ib_login_3m","int",{scale:4,shape:[0,0.3,1,2.2,8],maxMult:3,nullFn:t=>t===8?1:0.021*jit(0.1),psiFn:t=>t===8?8.74:smallPsi()});
addNum("mobile_os_ver","double",{dec:true,qFn:()=>[11.2,13.1,14.4,15.6,17.1],max:17.5,min:9,nullFn:()=>0.996+(rnd()-0.5)*0.002});
addNum("old_campaign_flag","int",{nullFn:()=>1,psiFn:()=>null});
addConst("sys_version","int",TIMES.map(()=>3));
addConst("fx_rate_usd","double",[31.02,31.35,31.88,32.10,32.47,32.43,32.05,31.71,31.62,32.19,32.51,32.78,32.86,32.94],true);
addNum("mort_flag","int",{qFn:()=>[0,0,0,0,0],max:1,min:0});
addNum("vip_flag","int",{qFn:()=>[0,0,0,0,1],max:1,min:0});
addStr("seg_code",{nul:0.003,cats:["A1","A2","A3","A4","A5"],sharesFn:()=>[0.41,0.24,0.18,0.11,0.06]});
addStr("channel_pref",{nul:0.012,cats:["BRANCH","ATM","WEB","APP","APP_V2"],
  sharesFn:t=>{const v=t>=10?[0.06,0.11,0.16,0.21][t-10]:0;return[0.34-v*0.4,0.22,0.19,0.25-v*0.6,v];},
  psiFn:t=>t>=10?[0.12,0.21,0.29,0.38][t-10]:0.002+rnd()*0.015});
addStr("legacy_tier",{nul:0,cats:["N"],sharesFn:()=>[1],constVal:"N"});

/* 相關性（最新一期、抽 50,000 筆） */
const CORR_FEATS=["bal_avg_1m","bal_avg_3m","bal_avg_6m","dep_bal","fund_aum","salary_in_1m","txn_cnt_1m","txn_cnt_3m","txn_amt_1m","txn_amt_3m","card_spend_1m","card_spend_3m"];
const PAIR={"bal_avg_1m|bal_avg_3m":0.983,"bal_avg_3m|bal_avg_6m":0.977,"bal_avg_1m|bal_avg_6m":0.951,"txn_cnt_1m|txn_cnt_3m":0.962,"txn_amt_1m|card_spend_1m":0.957,
"txn_amt_1m|txn_amt_3m":0.912,"card_spend_1m|card_spend_3m":0.931,"txn_amt_3m|card_spend_3m":0.904,"txn_amt_1m|card_spend_3m":0.88,"txn_amt_3m|card_spend_1m":0.89,
"bal_avg_1m|dep_bal":0.862,"bal_avg_3m|dep_bal":0.848,"bal_avg_6m|dep_bal":0.823,
"bal_avg_1m|fund_aum":0.412,"bal_avg_3m|fund_aum":0.418,"bal_avg_6m|fund_aum":0.421,"dep_bal|fund_aum":0.377,
"bal_avg_1m|salary_in_1m":0.352,"bal_avg_3m|salary_in_1m":0.349,"bal_avg_6m|salary_in_1m":0.341,"dep_bal|salary_in_1m":0.318,
"txn_amt_1m|txn_cnt_1m":0.644,"txn_amt_3m|txn_cnt_3m":0.661,"txn_amt_3m|txn_cnt_1m":0.598,"txn_amt_1m|txn_cnt_3m":0.602,"card_spend_1m|txn_cnt_1m":0.587,"card_spend_3m|txn_cnt_3m":0.603,"card_spend_3m|txn_cnt_1m":0.55,"card_spend_1m|txn_cnt_3m":0.56,
"salary_in_1m|txn_amt_1m":0.281,"salary_in_1m|txn_amt_3m":0.289,"fund_aum|txn_cnt_1m":-0.084,"fund_aum|txn_cnt_3m":-0.071};
const fnull=n=>F.find(f=>f.name===n).null[LATEST];
const CORR={};
CORR_FEATS.forEach((a,i)=>CORR_FEATS.forEach((b,j)=>{
  if(j<=i)return;
  const v=PAIR[a+"|"+b]??PAIR[b+"|"+a]??Math.round((0.05+rnd()*0.2)*1000)/1000;
  const n=Math.round(50000*(1-fnull(a))*(1-fnull(b)));
  CORR[a+"|"+b]={v,n};CORR[b+"|"+a]={v,n};
}));
const HIGH=Object.entries(CORR).filter(([k,o])=>{const[a,b]=k.split("|");return CORR_FEATS.indexOf(a)<CORR_FEATS.indexOf(b)&&Math.abs(o.v)>=TH.corr;})
  .map(([k,o])=>{const[a,b]=k.split("|");return{a,b,v:o.v,n:o.n};}).sort((x,y)=>Math.abs(y.v)-Math.abs(x.v));
const IN_HIGH=new Set(HIGH.flatMap(p=>[p.a,p.b]));
const MATRIX=CORR_FEATS.filter(n=>IN_HIGH.has(n));

/* ---------- 問題類型 ---------- */
const FLAG={
  null_all:{label:"每一期都幾乎是空值",cond:"每一期的空值比例都 ≥ 99%",act:"欄位沒有資訊，可以排除"},
  const_all:{label:"整欄只有一個值",cond:"所有期別合計只有一個值（不含空值）",act:"欄位沒有資訊，可以排除"},
  null_some:{label:"部分期別幾乎是空值",cond:"只有部分期別的空值比例 ≥ 99%",act:"欄位本身正常，請檢查這幾期的上游資料"},
  const_some:{label:"部分期別只有一個值",cond:"只有部分期別只有一個值（不含空值）",act:"欄位本身正常，請檢查這幾期的上游資料"},
  const_each:{label:"每期各只有一個值",cond:"每一期只有一個值，但各期的值不同",act:"通常是匯率這類每期一個數字的總體指標，不一定要排除"},
  precision:{label:"float32 精度不足",cond:"有小數且絕對值最大 ≥ 100,000；或整數且絕對值最大 ≥ 16,777,216",act:"對 LightGBM 幾乎沒有影響；但整數與 decimal 欄位會被 dataset 的精度檢查擋下（numeric_precision_policy 預設 block），可請上游四捨五入，或改成 truncate 接受失真"},
  drift:{label:"分布偏移",cond:"有一期的 PSI ≥ 0.25（和最早一期比較）",act:"到 03 頁看從哪一期開始變；若是單位改變，請上游修正"},
  outlier:{label:"極端值",cond:"有一期倍數 ≥ 10，且取 log 後倍數 ≥ 1",act:"到 03 頁看那一期的最大值或最小值，確認是不是資料錯誤"},
  corr:{label:"高度相關",cond:"最新一期 Spearman 相關係數的絕對值 ≥ 0.95",act:"同一組通常留一個就夠；樹模型不一定要刪"}
};
const FLAG_ORDER=["null_all","const_all","null_some","const_some","const_each","precision","drift","outlier","corr"];
const EXCLUDE_KEYS=["null_all","const_all"];
function outT(f){
  const r=[];
  for(let t=0;t<T;t++){
    const hi=f.tailHi[t]!=null&&f.tailHi[t]>=TH.tail_ratio&&f.logHi[t]>=TH.tail_log_ratio;
    const lo=f.tailLo[t]!=null&&f.tailLo[t]>=TH.tail_ratio&&f.logLo[t]>=TH.tail_log_ratio;
    if(hi||lo)r.push(t);
  }
  return r;
}
/* 最離譜的那一期、那一側 */
function worst(f){
  let best=null;
  outT(f).forEach(t=>{
    [[true,f.tailHi[t],f.logHi[t],f.max[t]],[false,f.tailLo[t],f.logLo[t],f.min[t]]].forEach(([hi,r,l,v])=>{

const oddVal=w=>(w.hi?"最大值 ":"最小值 ")+num(w.v);
F.forEach(f=>{

  if(f.constAt.every(Boolean)){

    fl.push("const_each");f.flags=fl;return;
  }

  if(f.kind==="num"&&maxAbs(f)>=(f.dec?TH.precision_max_abs:INT_EXACT))fl.push("precision");

  if(IN_HIGH.has(f.name))fl.push("corr");

  f.nearconst=f.kind==="num"&&!f.constAt.some(Boolean)&&f.q.some(q=>q&&q[0]===q[4]);

function maxAbs(f){let m=-1,at=null;f.max.forEach((v,t)=>{if(v!=null&&Math.abs(v)>m){m=Math.abs(v);at=t;}});f.min.forEach((v,t)=>{if(v!=null&&Math.abs(v)>m){m=Math.abs(v);at=t;}});maxAbs.at=at;return m;}

  const rows=F.map(f=>{const nn=f.null;const q=f.q[LATEST];const ps=f.psi.filter(v=>v!=null);
    return[f.name,f.dtype,flagNames(f)||"—",pct(Math.min(...nn))+" 至 "+pct(Math.max(...nn)),q?num(q[2]):"",f.max[LATEST]!=null?num(f.max[LATEST]):"",ps.length?fx(Math.max(...ps),2):""];});
  h+=sec("各欄位摘要","每個欄位一列。中位數與最大值取最新一期。",[tbl(["欄位","型別","問題類型","空值比例（最低至最高）","中位數","最大值","PSI 最大值"],rows,[4,5,6])]);
  h+=sec("各期中位數","數值欄位每一期的中位數。",[tbl(["欄位"].concat(TIMES),NUMERIC.map(f=>[f.name].concat(f.q.map(q=>q?num(q[2]):""))),TIMES.map((_,i)=>i+1))],{collapsible:true});
  h+=sec("各期最大值","數值欄位每一期的最大值。",[tbl(["欄位"].concat(TIMES),NUMERIC.map(f=>[f.name].concat(f.max.map(v=>v==null?"":num(v)))),TIMES.map((_,i)=>i+1))],{collapsible:true});
  h+=sec("各期 PSI","每一期和最早一期比較的 PSI。",[tbl(["欄位"].concat(TIMES),F.map(f=>[f.name].concat(f.psi.map(v=>v==null?"":fx(v,3)))),TIMES.map((_,i)=>i+1))],{collapsible:true});
  h+=sec("未檢查的欄位","型別不支援（date、timestamp、array、map、struct）而沒有檢查的欄位。",["<p>這次沒有。</p>"]);
  return h;
}

/* ---------- 圖（真的報表用 plotly python 畫，同一套 plotly.js） ---------- */
function C(){const cs=getComputedStyle(document.documentElement);const g=n=>cs.getPropertyValue(n).trim();
  return{bg:g("--bg"),fg:g("--fg"),muted:g("--chart-muted"),grid:g("--grid"),axis:g("--axis"),border:g("--border"),dark:g("--mode")==="dark"};}
function seq(c){return c.dark?[[0,"#1a1a19"],[0.1,"#104281"],[0.35,"#256abf"],[0.5,"#5598e7"],[1,"#cde2fb"]]:[[0,"#fcfcfb"],[0.1,"#cde2fb"],[0.35,"#86b6ef"],[0.5,"#2a78d6"],[1,"#0d366b"]];}
function div(c){return c.dark?[[0,"#f08a89"],[0.25,"#8a3a3a"],[0.5,"#383835"],[0.75,"#256abf"],[1,"#9ec5f4"]]:[[0,"#b8322f"],[0.25,"#f0a3a2"],[0.5,"#f0efec"],[0.75,"#86b6ef"],[1,"#104281"]];}
const onCell=c=>c.dark?"#0d0d0d":"#ffffff";
function base(c,extra){
  const ax={gridcolor:c.grid,linecolor:c.axis,zerolinecolor:c.axis,tickfont:{color:c.muted},title:{font:{color:c.muted}}};
  return Object.assign({paper_bgcolor:c.bg,plot_bgcolor:c.bg,font:{family:'-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC",sans-serif',color:c.fg,size:12},
    margin:{l:130,r:20,t:20,b:80},hoverlabel:{bgcolor:c.bg,bordercolor:c.border,font:{color:c.fg}},
    xaxis:Object.assign({},ax),yaxis:Object.assign({},ax)},extra||{});
}
const CFG={displaylogo:false,responsive:true};
const PLOTS={
  basic:[function(c){
    const rows=F.filter(f=>Math.max(...f.null)>=0.005).sort((a,b)=>Math.max(...b.null)-Math.max(...a.null));
    const L=base(c,{height:90+rows.length*28});L.xaxis.type="category";L.xaxis.tickangle=-45;L.yaxis.autorange="reversed";L.yaxis.type="category";
    Plotly.react("fig-null",[{type:"heatmap",x:TIMES,y:rows.map(f=>f.name),z:rows.map(f=>f.null),zmin:0,zmax:1,colorscale:seq(c),xgap:2,ygap:2,
      text:rows.map(f=>f.null.map(v=>v>=TH.null_ratio?"≥99%":"")),texttemplate:"%{text}",textfont:{color:onCell(c),size:10},
      hovertemplate:"%{y}<br>%{x}<br>空值比例 %{z:.2%}<extra></extra>",
      colorbar:{title:{text:"空值比例",font:{color:c.muted}},tickformat:".0%",outlinewidth:0,tickfont:{color:c.muted},thickness:12}}],L,CFG);
  }],
  drift:[function(c){
    const rows=F.filter(f=>f.psi.some(v=>v!=null)).map(f=>({f,m:Math.max(...f.psi.filter(v=>v!=null))})).sort((a,b)=>b.m-a.m).slice(0,12).map(o=>o.f);
    const L=base(c,{height:90+rows.length*30});L.xaxis.type="category";L.xaxis.tickangle=-45;L.yaxis.autorange="reversed";L.yaxis.type="category";
    Plotly.react("fig-psi",[{type:"heatmap",x:TIMES,y:rows.map(f=>f.name),z:rows.map(f=>f.psi.map(v=>v==null?null:Math.min(v,0.5))),
      customdata:rows.map(f=>f.psi),zmin:0,zmax:0.5,colorscale:seq(c),xgap:2,ygap:2,
      text:rows.map(f=>f.psi.map(v=>v!=null&&v>=TH.psi?v.toFixed(2):"")),texttemplate:"%{text}",textfont:{color:onCell(c),size:10},
      hovertemplate:"%{y}<br>%{x}<br>PSI %{customdata:.3f}<extra></extra>",
      colorbar:{title:{text:"PSI",font:{color:c.muted}},tickvals:[0,0.1,0.25,0.5],ticktext:["0","0.1","0.25","≥ 0.5"],outlinewidth:0,tickfont:{color:c.muted},thickness:12}}],L,CFG);
  },function(c){
    const pmax=f=>Math.max(...f.psi.filter(v=>v!=null));
    const feats=NUMERIC.filter(f=>f.flags.includes("drift")).sort((a,b)=>pmax(b)-pmax(a));
    const wide=c.dark?"rgba(57,135,229,0.20)":"rgba(42,120,214,0.14)", mid=c.dark?"rgba(57,135,229,0.42)":"rgba(42,120,214,0.34)", line=c.dark?"#3987e5":"#2a78d6";
    const traces=[];
    feats.forEach((f,i)=>{
      const g=k=>f.q.map(q=>q?q[k]:null), vis=i===0;
      traces.push({x:TIMES,y:g(4),name:"p99",mode:"lines",line:{width:0},showlegend:false,visible:vis,hovertemplate:"p99 %{y:,}<extra></extra>"});
      traces.push({x:TIMES,y:g(0),name:"p1 至 p99",mode:"lines",line:{width:0},fill:"tonexty",fillcolor:wide,visible:vis,hovertemplate:"p1 %{y:,}<extra></extra>"});
      traces.push({x:TIMES,y:g(3),name:"p75",mode:"lines",line:{width:0},showlegend:false,visible:vis,hovertemplate:"p75 %{y:,}<extra></extra>"});
      traces.push({x:TIMES,y:g(1),name:"p25 至 p75",mode:"lines",line:{width:0},fill:"tonexty",fillcolor:mid,visible:vis,hovertemplate:"p25 %{y:,}<extra></extra>"});
      traces.push({x:TIMES,y:g(2),name:"中位數",mode:"lines+markers",line:{width:2,color:line},marker:{size:8,color:line,line:{color:c.bg,width:2}},visible:vis,hovertemplate:"中位數 %{y:,}<extra></extra>"});
    });
    const label=f=>f.name;
    const buttons=feats.map((f,i)=>({label:label(f),method:"update",args:[{visible:traces.map((_,k)=>Math.floor(k/5)===i)}]}));
    const L=base(c,{height:420,hovermode:"x unified",margin:{l:80,r:20,t:60,b:80},legend:{orientation:"h",x:1,xanchor:"right",y:1.12,font:{color:c.fg}},
      updatemenus:[{type:"dropdown",x:0,xanchor:"left",y:1.16,yanchor:"top",buttons,bgcolor:c.bg,bordercolor:c.border,font:{color:c.fg},active:0}]});
    L.xaxis.type="category";L.xaxis.tickangle=-45;L.yaxis.tickformat=",";
    Plotly.react("fig-band",traces,L,CFG);
  },function(c){
    const pal=c.dark?["#3987e5","#d95926","#199e70","#c98500","#d55181"]:["#2a78d6","#eb6834","#1baf7a","#eda100","#e87ba4"];
    STRS.filter(f=>f.flags.includes("drift")).forEach(f=>{
      const tr=f.cats.map((cat,k)=>({type:"bar",name:cat,x:TIMES,y:f.shares.map(s=>s[k]),marker:{color:pal[k%pal.length],line:{color:c.bg,width:2}},hovertemplate:cat+" %{y:.1%}<extra></extra>"}));
      const L=base(c,{height:380,barmode:"stack",bargap:0.25,margin:{l:60,r:20,t:40,b:80},legend:{orientation:"h",x:0,y:1.14,font:{color:c.fg}}});
      L.xaxis.type="category";L.xaxis.tickangle=-45;L.yaxis.tickformat=".0%";L.yaxis.range=[0,1];
      Plotly.react("fig-str-"+f.name,tr,L,CFG);
    });
  }],
  corr:[function(c){
    const n=MATRIX;
    const z=n.map(a=>n.map(b=>a===b?null:CORR[a+"|"+b].v));
    const L=base(c,{height:120+n.length*56,margin:{l:120,r:20,t:20,b:120}});L.yaxis.autorange="reversed";L.xaxis.tickangle=-45;L.xaxis.type="category";L.yaxis.type="category";
    Plotly.react("fig-corr",[{type:"heatmap",x:n,y:n,z,zmin:-1,zmax:1,colorscale:div(c),xgap:2,ygap:2,
      text:z.map(r=>r.map(v=>v!=null&&Math.abs(v)>=TH.corr?v.toFixed(2):"")),texttemplate:"%{text}",textfont:{color:onCell(c),size:10},
      hovertemplate:"%{y} × %{x}<br>相關係數 %{z:.3f}<extra></extra>",
      colorbar:{title:{text:"相關係數",font:{color:c.muted}},outlinewidth:0,tickfont:{color:c.muted},thickness:12}}],L,CFG);
  }]
};

/* ---------- 分頁切換 ---------- */
const RENDER={index:pageIndex,flags:pageFlags,basic:pageBasic,drift:pageDrift,corr:pageCorr,all:pageAll};
const tabs=document.getElementById("tabs"), host=document.getElementById("pages");
const drawn={};
PAGES.forEach(p=>{
  const b=document.createElement("button");b.type="button";b.id="tab-"+p.id;b.setAttribute("role","tab");b.setAttribute("aria-controls","p-"+p.id);b.textContent=p.file;
  b.addEventListener("click",()=>{if(location.hash!=="#p-"+p.id)location.hash="p-"+p.id;else show(p.id);});
  tabs.appendChild(b);
  const s=document.createElement("section");s.className="page";s.id="p-"+p.id;s.setAttribute("role","tabpanel");s.hidden=true;
  try{s.innerHTML=RENDER[p.id]();}catch(e){s.innerHTML='<p class="noplot">這一頁產生失敗：'+esc(e.message)+"</p>";}
  host.appendChild(s);
});
function draw(id){
  if(!PLOTS[id])return;
  if(!window.Plotly){document.querySelectorAll("#p-"+id+" .fig").forEach(el=>{el.innerHTML='<p class="noplot">畫圖程式沒有載入，圖表無法顯示；表格不受影響。</p>';});return;}
  const c=C();PLOTS[id].forEach(fn=>{try{fn(c);}catch(e){console.error(e);}});drawn[id]=true;
}
function show(id){
  if(!RENDER[id])id="index";
  PAGES.forEach(p=>{const on=p.id===id;document.getElementById("p-"+p.id).hidden=!on;document.getElementById("tab-"+p.id).setAttribute("aria-selected",on?"true":"false");});
  requestAnimationFrame(()=>draw(id));
}
function current(){const m=location.hash.match(/^#p-([a-z]+)$/);return m&&RENDER[m[1]]?m[1]:"index";}
window.addEventListener("hashchange",()=>{show(current());window.scrollTo(0,0);});
show(current());
function redraw(){Object.keys(drawn).forEach(k=>delete drawn[k]);draw(current());}
try{window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",redraw);}catch(e){}
new MutationObserver(redraw).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
})();
</script>
