# 表名加前綴 recsys_prod_。tables 照抄 conf/base/ 的同名檔，只改 name 與 depends_on（清單只能整段覆蓋）。
inference_population_etl:
  tables:
    - name: recsys_prod_inference_population
      sql_file: inference_population/inference_population.sql
      partition_by:
        snap_date: DATE
      primary_key: [snap_date, user_id, slot_id]
      quality_checks:
        min_row_count: 1
        max_duplicate_key_ratio: 0.0

  audit:
    table: recsys_prod_etl_audit_log
