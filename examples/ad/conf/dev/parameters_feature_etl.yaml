# 表名加前綴 recsys_prod_。tables 照抄 conf/base/ 的同名檔，只改 name 與 depends_on（清單只能整段覆蓋）。
feature_etl:
  tables:
    - name: recsys_prod_feature_user
      sql_file: feature/feature_user.sql
      partition_by:
        snap_date: DATE
      primary_key: [snap_date, user_id]
      quality_checks:
        min_row_count: 1
        max_duplicate_key_ratio: 0.0

    - name: recsys_prod_feature_slot
      sql_file: feature/feature_slot.sql
      partition_by:
        snap_date: DATE
      primary_key: [snap_date, slot_id]
      quality_checks:
        min_row_count: 1
        max_duplicate_key_ratio: 0.0

    - name: recsys_prod_feature_user_slot
      sql_file: feature/feature_user_slot.sql
      partition_by:
        snap_date: DATE
      primary_key: [snap_date, user_id, slot_id]
      depends_on: [recsys_prod_feature_user, recsys_prod_feature_slot]
      quality_checks:
        min_row_count: 1
        max_duplicate_key_ratio: 0.0

    - name: recsys_prod_feature_table
      sql_file: feature/feature_table.sql
      partition_by:
        snap_date: DATE
      primary_key: [snap_date, user_id, slot_id]
      depends_on: [recsys_prod_feature_user, recsys_prod_feature_slot, recsys_prod_feature_user_slot]
      quality_checks:
        min_row_count: 1
        max_duplicate_key_ratio: 0.0

    - name: recsys_prod_feature_realtime
      sql_file: feature/feature_realtime.sql
      partition_by:
        snap_date: DATE
      primary_key: [snap_date, user_id, slot_id, request_id, campaign_id, creative_format]
      quality_checks:
        min_row_count: 1
        max_duplicate_key_ratio: 0.0

  audit:
    table: recsys_prod_etl_audit_log
