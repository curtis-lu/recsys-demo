# 與根目錄 conf/base/parameters_training.yaml（銀行示例）不同的地方：
#   - sample_weight_keys：item 欄名換成 ad_creative
#   - n_trials／num_iterations／early_stopping_rounds 調小；search_space 只搜三個參數，範圍也不同
#   - log_period: 0（不印每輪指標）；spark.app_name、mlflow.experiment_name 換名
# 調小的理由：本示例的目的是「每張票都能在幾分鐘內整條實跑」，不是把模型調好。
spark:
  app_name: recsys_tfb_ad_example-training

spark_lifecycle:
  release_during_hpo: true

training:
  algorithm: lightgbm
  algorithm_params:
    objective: binary
    metric: binary_logloss
    verbosity: -1
    log_period: 0
    num_threads: 4
  sample_weight_keys:
    - ad_creative
  sample_weights: {}
  # 把每一列當成二元預測的 average precision（#430）。選它是為了讓端到端實跑走到這條
  # 程式路徑，不是因為它在這份資料上選模比較好（在這裡組內排序指標更穩，數字見 README
  # 〈這組 conf 刻意沒打開的東西〉）。A48 要求 val 的 r > 0：parameters_dataset.yaml 設了
  # val_zero_positive_group_ratio: 0.5，拿掉它這裡就會被擋。
  hpo_objective: pooled_average_precision
  n_trials: 5
  num_iterations: 200
  early_stopping_rounds: 30
  final_model_strategy: hpo_best
  feature_selection:
    exclude: []
  search_space:
    - name: learning_rate
      type: float
      low: 0.01
      high: 0.2
      log: true
    - name: num_leaves
      type: int
      low: 4
      high: 32
    - name: min_child_samples
      type: int
      low: 10
      high: 100

mlflow:
  experiment_name: recsys_tfb_ad_example
  tracking_uri: "${env.MLFLOW_TRACKING_URI|mlruns}"
  strict: false

cache:
  root: data/recsys_cache

diagnostics:
  feature_stats:
    enabled: true
    sample_rows: 500000
    high_null_threshold: 0.5
  feature_importance:
    enabled: true
  gain_ledger:
    enabled: true
  shap:
    enabled: true
    background: global
    sample_rows: 2000
    top_k: 30
    min_rows_per_item: 30
    max_budget: 4000000
    profile_positive: true
    positive_min_rows: 20
    positive_sample_per_item: 30
    divergence_metric: jaccard_topk
    divergence_top_k: 15
    per_item_beeswarm: true
    quadrant_enabled: true
    quadrant_top_k_decision: 1
    quadrant_sample_per_cell: 30
    quadrant_min_rows: 10
    case_top_k: 15
  hpo_search:
    enabled: true
    patience: 10
    boundary_hi: 0.98
    boundary_lo: 0.02

hpo_checkpointing: true
