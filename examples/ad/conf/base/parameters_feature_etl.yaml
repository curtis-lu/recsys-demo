# 框架收兩類特徵表（ADR-0026）：
# - entity 層級（time ＋ entity，恰好一張）：feature_table。使用者特徵以 user_id、版位特徵以
#   slot_id 分開算，最後在 feature_table.sql 併到 (snap_date, user_id, slot_id)——比 base key
#   粗的表框架不收，要在 SQL 展開。
# - 候選層級（identity，最多一張）：feature_realtime，一次曝光一列，catalog 的
#   candidate_feature_table 指到它。它不併進 feature_table：一次請求一列的表併進去，
#   等於把每日特徵抄進每一次曝光。
feature_etl:
  # 資料的第 2～11 週。第 1 週 2025-10-27 只給後面的週當回看窗。
  # 沒給 --target-dates 時用這裡的日期，例 ["2025-01-31"]（日期要加引號，否則 YAML 會讀成日期物件）；
  # 兩邊都沒有就報錯。
  target_dates:
    - "2025-11-03"
    - "2025-11-10"
    - "2025-11-17"
    - "2025-11-24"
    - "2025-12-01"
    - "2025-12-08"
    - "2025-12-15"
    - "2025-12-22"
    - "2025-12-29"
    - "2026-01-05"
  # 每次執行的 SQL 存到 <這裡>/<run_id>/<target_date>/<table>.sql；路徑相對於執行指令時的目錄。
  # 不想存，寫 rendered_sql_dir: ~ 或刪掉這行。
  rendered_sql_dir: data/rendered_sql
  variables:
    # 必填：中介表與最終表寫入的 Hive database；沒寫會被 A59 擋下。
    target_db: "ad_recsys"
    # ETL 寫的每張表（中介表與最終表）的表名前綴。SQL 讀這些表時寫
    # ${target_db}.${table_prefix}<表名>；tables 的 name 要寫加了前綴的完整表名。
    # base 不加前綴，conf/dev/ 示範加 recsys_prod_。
    table_prefix: ""
    raw_db: "ad_raw"

  # 上游 source table 的新鮮度 / schema 檢查。只在加 --source-check 時執行，一般 ETL 不會跑。
  # {}、~、整行不寫，都等於沒有要檢查的上游表。
  source_checks: {}

  tables:
    - name: feature_user
      sql_file: feature/feature_user.sql
      partition_by:
        snap_date: DATE
      primary_key: [snap_date, user_id]
      quality_checks:
        min_row_count: 1
        max_duplicate_key_ratio: 0.0

    - name: feature_slot
      sql_file: feature/feature_slot.sql
      partition_by:
        snap_date: DATE
      primary_key: [snap_date, slot_id]
      quality_checks:
        min_row_count: 1
        max_duplicate_key_ratio: 0.0

    - name: feature_user_slot
      sql_file: feature/feature_user_slot.sql
      partition_by:
        snap_date: DATE
      primary_key: [snap_date, user_id, slot_id]
      depends_on: [feature_user, feature_slot]
      quality_checks:
        min_row_count: 1
        max_duplicate_key_ratio: 0.0

    - name: feature_table
      sql_file: feature/feature_table.sql
      partition_by:
        snap_date: DATE
      primary_key: [snap_date, user_id, slot_id]
      depends_on: [feature_user, feature_slot, feature_user_slot]
      quality_checks:
        min_row_count: 1
        max_duplicate_key_ratio: 0.0

    - name: feature_realtime
      sql_file: feature/feature_realtime.sql
      partition_by:
        snap_date: DATE
      # identity：dataset 以這組鍵接它，重複的鍵會讓候選變成好幾列
      primary_key: [snap_date, user_id, slot_id, request_id, campaign_id, creative_format]
      quality_checks:
        min_row_count: 1
        max_duplicate_key_ratio: 0.0

  # 稽核紀錄（寫到這張 Hive 表）。整段不寫或寫 ~ 就不寫稽核紀錄。
  audit:
    database: "${target_db}"
    table: etl_audit_log
