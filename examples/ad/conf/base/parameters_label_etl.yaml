label_etl:
  dry_run: false
  target_dates:
    - "2025-11-03"
    - "2025-11-10"
    - "2025-11-17"
    - "2025-11-24"
    - "2025-12-01"
    - "2025-12-08"
    - "2025-12-15"
    - "2025-12-22"
    - "2025-12-29"
    - "2026-01-05"
  variables:
    target_db: "ad_recsys"
    raw_db: "ad_raw"

  source_checks: {}

  tables:
    - name: label_table
      sql_file: label/label_table.sql
      partition_by:
        snap_date: DATE
      # ＝ identity（宣告 event 之後多了 impression_id）。少寫一欄，
      # max_duplicate_key_ratio: 0.0 會把「同一素材本週的多次曝光」
      # 判成重複鍵而擋下整條 ETL。
      primary_key: [snap_date, user_id, slot_id, ad_creative, impression_id]
      quality_checks:
        min_row_count: 1
        max_duplicate_key_ratio: 0.0

  audit:
    database: "${target_db}"
    table: etl_audit_log
