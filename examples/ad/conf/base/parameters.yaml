# 廣告情境示例（線上廣告推薦的離線訓練與評估）。
# 本資料夾的每份 yaml 都對應 repo 根目錄 conf/base/ 的同名檔；每個鍵的完整說明
# 在那裡，這裡只註解「和銀行示例不一樣、為什麼」。怎麼跑見 examples/ad/README.md。
#
# ⚠ 這組 conf 目前打開的新開關是 occasion（#428）：一次請求是一個 query group，
# 同一次請求可能展示好幾個素材。其餘仍是框架今天就支援的功能——只有一張
# feature_table、item 清單逐一列出、預測品質指標家族不開。後面的票各自打開
# 自己的開關（docs/notes/2026-09-16-event-support-plan.md）。

project_name: recsys_tfb_ad_example
random_seed: 42

hive:
  db: ad_recsys   # 與銀行示例的 ml_recsys 分開：兩邊的本機 metastore 本來就不同，換名是讓 log 一眼分得出是哪個示例

spark:
  app_name: recsys_tfb_ad_example

schema:
  columns:
    # 一週一個時段（每週一）。ADR-0021：time 維持「時段」；到秒的請求時間在 occasion。
    # 欄名必須叫 snap_date：source_etl 的輸出檢查把 WHERE snap_date = … 寫死了
    # （pipelines/source_etl/checks.py），換名 source_etl 就壞。
    time: snap_date
    entity: [user_id, slot_id]   # 替「某個使用者在某個版位」排一次
    item: ad_creative            # 活動 × 素材格式，在 label／sample_pool SQL 拼成一欄
    # 形狀二（ADR-0021、ADR-0025、#428）：一次請求（到秒）展示好幾個素材，query
    # group ＝ snap_date ＋ entity ＋ occasion；identity 多了 request_id，排在 item
    # 之前（occasion 在 entity 與 item 之間，event 才排在 item 之後）。
    #
    # 為什麼不宣告 event：同一次請求裡的素材互不重複（generate_data.py 不放回
    # 抽樣），identity 光靠 occasion 就唯一——宣告了 event 只會多一欄沒有作用的
    # identity（event 進 identity、不進分組，這裡分組本身已經唯一了）。
    #
    # 想改回形狀一（同一 entity × 時段一組、event 進 identity、occasion 不宣告，
    # #378 已用這份資料跑綠過）：這裡把 occasion 換回 event ＝ impression_id；
    # conf/sql/etl/label/label_table.sql 與 sample_pool.sql 把 request_id 換回
    # impression_id；parameters_label_etl.yaml 與 parameters_sample_pool_etl.yaml
    # 的 primary_key 換回 impression_id；catalog.yaml 的
    # training_eval_predictions.columns 換回 impression_id。
    occasion: request_id
    label: label                 # 這一次曝光有沒有被點
    score: score
    rank: rank
  # item 清單逐一列出；改成「從資料數」是 #379。必須等於 generate_data.py 產出的組合
  # （tests/examples/test_ad_example.py 守這一條）。
  categorical_values:
    ad_creative:
      - c01-banner
      - c01-native
      - c01-video
      - c02-banner
      - c02-native
      - c02-video
      - c03-banner
      - c03-native
      - c03-video
      - c04-banner
      - c04-native
      - c04-video

logging:
  level: INFO
  console: true
  file:
    enabled: true
    path: logs/
    format: json
