dataset:
  # 一週一個 snap_date（每週一）。第一週 2025-10-27 只當特徵回看窗，不進任何 split。
  train_snap_dates:
    - "2025-11-03"
    - "2025-11-10"
    - "2025-11-17"
    - "2025-11-24"
    - "2025-12-01"
    - "2025-12-08"

  sample_ratio: 1.0
  # user_segment 由 sample_pool SQL 從註冊年資算出，只在 sample_pool，不在 feature_table
  # ——所以不必像銀行示例的 cust_segment_typ 那樣同時列進 drop_columns（B7）。
  sample_group_keys:
    - "user_segment"
    - "ad_creative"
    - "label"
  # 熱門素材的負例抽一半：讓抽樣這條路真的被走到，不是為了模型好
  sample_ratio_overrides:
    "loyal|c01-banner|0": 0.5
    "regular|c01-banner|0": 0.5
    "new|c01-banner|0": 0.5

  carry_columns:
    - user_segment

  train_dev_ratio: 0.1
  # 同一個使用者的不同版位不得跨 train／train_dev：entity 是 [user_id, slot_id]，
  # 洩漏單位是使用者（A29 的用途正是這種情況）。
  train_split_keys: ["user_id"]

  val_snap_dates:
    - "2025-12-22"
  # 母體只有幾百人，val 不抽樣（銀行示例是 0.5，理由是生產母體百萬級）
  val_sample_ratio: 1.0

  test_snap_dates:
    - "2025-12-29"

  # 沒有正例的 query group 留一半（ADR-0025 決定 3、#429）。形狀二下一次請求就是一組、
  # 平均約 4 個素材，多數請求沒有點擊；全丟的話 test 只剩「有人點過」的請求，預測品質
  # 指標家族（把每一列當二元預測）會系統性偏高——report.sections.prediction_quality
  # 打開時，evaluation --post-training 在入口就擋下 test 的 r ＝ 0（A46）。
  # r > 0 時表多一欄 zero_positive_group_weight（1 或 1／r），catalog.yaml 的
  # training_eval_predictions 要宣告它（A45）。val 也設，讓 val 那條路被走到；HPO 的
  # 兩個分數都跳過沒有正例的組，所以不受影響。0.5 只是示例值，不是建議值。
  # train 不設（r ＝ 1）：這組 conf 的 objective 是 binary，r < 1 會是整組的負例降採樣。
  val_zero_positive_group_ratio: 0.5
  test_zero_positive_group_ratio: 0.5

  numeric_precision_policy: block

  prepare_model_input:
    # 只列 feature_table 裡有的欄（列了不存在的欄會警告）；label 由框架自動排除
    drop_columns:
      - "snap_date"
      - "user_id"
      - "slot_id"   # 版位的特性由 slot_position／page_type 帶進模型；ID 本身是 identity
    categorical_columns:
      - "ad_creative"
      - "age_band"
      - "device_type"
      - "region"
      - "slot_position"
      - "page_type"
