# run_e2e.sh 只跑 --post-training 模式（讀 training 的 test 預測）。evaluation.snap_date
# 只有一個值，post-training 要它在 test_snap_dates 裡（A22），監控模式要它在 inference
# 評分過的週裡；一份 conf 滿足不了兩邊，所以監控模式不在這條實跑路徑上。
evaluation:
  snap_date: "2025-12-29"   # 須在 dataset.test_snap_dates 裡（A22）

  # 一個 query group 最多 12 個 item，實際平均約 4 個（每週每版位只看到幾個素材）
  k_values: [1, 2, 3, 5, "all"]

  segment_columns:
    - user_segment
  segment_sources: {}

  # 大類＝活動：同一個活動的三種素材格式歸一類
  item_categories:
    enabled: true
    unmapped: singleton
    mapping:
      c01: [c01-banner, c01-native, c01-video]
      c02: [c02-banner, c02-native, c02-video]
      c03: [c03-banner, c03-native, c03-video]
      c04: [c04-banner, c04-native, c04-video]

  # 以「月」為單位的回看窗；週資料一樣能用，只是語意是月（evaluation/baselines.py）
  baseline:
    lookback_months: 12
    # score：熱門度基準線用哪個分數排名（#397；合法值由 A50 檢查）。
    #   count（沒寫＝這個）  回看期間的正例數，從 label_table 算。
    #   rate                 正例率＝正例數 ÷ 當過候選的次數，分母從 sample_pool 數。
    #                        候選集合是被展示的子集時（例如廣告）才需要：正例數會偏向
    #                        被展示最多的 item。只在 --post-training 生效；監控模式評的
    #                        是全網格，照舊用正例數。每期的兩個數落在
    #                        popularity_period_counts，算過的期不重算；補過來源資料要帶
    #                        --rebuild-dates。前提見 docs/pipelines/evaluation.md §3.4。
    # score: rate

  # 預測品質指標家族（#381）：這個情境的使用者主要把它當二元預測看，所以打開
  # （框架預設關）。三個值與框架預設相同。
  prediction_quality:
    n_bins: 1000
    n_display_bins: 10
    top_n: 30

  report:
    sections:
      dataset_overview: true
      primary_map: true
      diagnostics: true
      baseline: true
      diagnosis_links: true
      prediction_quality: true
    display:
      primary_map_k: [1, 3, "all"]
      guardrail_recall_k: [1, 2, 3, 5]
    diagnostics:
      include_distributions: true

  metric:
    weight_alpha: 0.0
    k: null
    min_positives: 0
    shrinkage_k: 0

  diagnosis:
    sample:
      max_queries: 250000
      min_pos_queries_per_item: 50
      seed: 42
    ci:
      enabled: true
      n_boot: 200
    config_shift:
      enabled: true
    item_ability:
      enabled: true
      top_n: 30
    model_capacity:
      enabled: true
    suppression:
      enabled: true
      top_examples: 50

  compare_sources: {}
