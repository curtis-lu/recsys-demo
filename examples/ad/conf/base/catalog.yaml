# 與 repo 根目錄 conf/base/catalog.yaml 同一份結構；每個條目為什麼長這樣，說明都在那裡。
# 兩處不同，都來自 schema 換了欄名：
#   - test_model_input 與預測表的 item 分區欄：prod_name → ad_creative
#   - training_eval_predictions 與推論三張表的 entity 欄：cust_id → user_id, slot_id
#     （entity 每一欄都要宣告：HiveTableDataset.save 最後只 select 宣告過的欄，
#      漏一欄會被靜默丟掉；A28 只替 training_eval_predictions 擋）
# 路徑和根目錄那份一樣是相對目前目錄的 data/…，從 examples/ad/ 執行就落在 examples/ad/data/。

# --- Source tables（唯讀，由 source_etl 維護）---
feature_table:
  type: HiveTableDataset
  database: ${hive.db}
  table: feature_table
  read_only: true

# 候選層級特徵表（ADR-0026）：一次曝光一列的即時特徵，dataset 以 identity 接。
# 宣告了它，離線推論會在入口被擋下（A47）。
candidate_feature_table:
  type: HiveTableDataset
  database: ${hive.db}
  table: feature_realtime
  read_only: true

label_table:
  type: HiveTableDataset
  database: ${hive.db}
  table: label_table
  read_only: true

sample_pool:
  type: HiveTableDataset
  database: ${hive.db}
  table: sample_pool
  read_only: true

inference_population:
  type: HiveTableDataset
  database: ${hive.db}
  table: inference_population
  read_only: true

# --- Dataset base layer ---
val_keys:
  type: HiveTableDataset
  database: ${hive.db}
  table: recsys_prod_val_keys
  external: false
  columns: "auto"
  partition_filter:
    base_dataset_version: ${base_dataset_version}
  partition_cols:
    - {name: snap_date, type: STRING}

test_keys:
  type: HiveTableDataset
  database: ${hive.db}
  table: recsys_prod_test_keys
  external: false
  columns: "auto"
  partition_filter:
    base_dataset_version: ${base_dataset_version}
  partition_cols:
    - {name: snap_date, type: STRING}

val_model_input:
  type: HiveTableDataset
  database: ${hive.db}
  table: recsys_prod_val_model_input
  external: false
  columns: "auto"
  partition_filter:
    base_dataset_version: ${base_dataset_version}
  partition_cols:
    - {name: snap_date, type: STRING}

test_model_input:
  type: HiveTableDataset
  database: ${hive.db}
  table: recsys_prod_test_model_input
  external: false
  columns: "auto"
  partition_filter:
    base_dataset_version: ${base_dataset_version}
  partition_cols:
    - {name: snap_date, type: STRING}
    - {name: ad_creative, type: STRING}

preprocessor:
  type: JSONDataset
  filepath: data/dataset/${base_dataset_version}/preprocessor.json

category_mappings:
  type: JSONDataset
  filepath: data/dataset/${base_dataset_version}/category_mappings.json

numeric_precision_report:
  type: JSONDataset
  filepath: data/dataset/${base_dataset_version}/numeric_precision_report.json

model_input_grain_report:
  type: JSONDataset
  filepath: data/dataset/${base_dataset_version}/model_input_grain_report.json

# --- Dataset train-variant layer ---
sample_keys:
  type: HiveTableDataset
  database: ${hive.db}
  table: recsys_prod_sample_keys
  external: false
  columns: "auto"
  partition_filter:
    base_dataset_version: ${base_dataset_version}
    train_variant_id: ${train_variant_id}
  partition_cols:
    - {name: snap_date, type: STRING}

train_keys:
  type: HiveTableDataset
  database: ${hive.db}
  table: recsys_prod_train_keys
  external: false
  columns: "auto"
  partition_filter:
    base_dataset_version: ${base_dataset_version}
    train_variant_id: ${train_variant_id}
  partition_cols:
    - {name: snap_date, type: STRING}

train_dev_keys:
  type: HiveTableDataset
  database: ${hive.db}
  table: recsys_prod_train_dev_keys
  external: false
  columns: "auto"
  partition_filter:
    base_dataset_version: ${base_dataset_version}
    train_variant_id: ${train_variant_id}
  partition_cols:
    - {name: snap_date, type: STRING}

preprocessed_feature_table:
  type: HiveTableDataset
  database: ${hive.db}
  table: recsys_prod_preprocessed_feature_table
  external: false
  columns: "auto"
  partition_filter:
    base_dataset_version: ${base_dataset_version}
  partition_cols:
    - {name: snap_date, type: STRING}

train_model_input:
  type: HiveTableDataset
  database: ${hive.db}
  table: recsys_prod_train_model_input
  external: false
  columns: "auto"
  partition_filter:
    base_dataset_version: ${base_dataset_version}
    train_variant_id: ${train_variant_id}
  partition_cols:
    - {name: snap_date, type: STRING}

train_dev_model_input:
  type: HiveTableDataset
  database: ${hive.db}
  table: recsys_prod_train_dev_model_input
  external: false
  columns: "auto"
  partition_filter:
    base_dataset_version: ${base_dataset_version}
    train_variant_id: ${train_variant_id}
  partition_cols:
    - {name: snap_date, type: STRING}

# --- Training ---
model:
  type: ModelAdapterDataset
  filepath: data/models/${model_version}/model.txt

best_params:
  type: JSONDataset
  filepath: data/models/${model_version}/best_params.json

best_iteration:
  type: JSONDataset
  filepath: data/models/${model_version}/best_iteration.json

hpo_best_model:
  type: ModelAdapterDataset
  filepath: data/models/${model_version}/hpo/model.txt

predict_manifest:
  type: JSONDataset
  filepath: data/models/${model_version}/predict_manifest.json

evaluation_results:
  type: JSONDataset
  filepath: data/models/${model_version}/evaluation_results.json

sample_weight_report:
  type: JSONDataset
  filepath: data/models/${model_version}/sample_weight_report.json

group_filter_report:
  type: JSONDataset
  filepath: data/models/${model_version}/group_filter_report.json

feature_statistics:
  type: JSONDataset
  filepath: data/models/${model_version}/diagnostics/feature_statistics.json

feature_importance:
  type: JSONDataset
  filepath: data/models/${model_version}/diagnostics/feature_importance.json

shap_diagnostics:
  type: JSONDataset
  filepath: data/models/${model_version}/diagnostics/shap_diagnostics.json

quadrant_profiles:
  type: JSONDataset
  filepath: data/models/${model_version}/diagnostics/per_quadrant.json

cases_manifest:
  type: JSONDataset
  filepath: data/models/${model_version}/diagnostics/cases/cases_manifest.json

gain_ledger:
  type: JSONDataset
  filepath: data/models/${model_version}/diagnostics/gain_ledger.json
  optional: true

training_eval_predictions:
  type: HiveTableDataset
  database: ${hive.db}
  table: training_eval_predictions
  external: false
  columns:
    - {name: user_id, type: STRING}
    - {name: slot_id, type: STRING}
    # schema.columns.occasion。沒宣告過的欄會被 HiveTableDataset.save 靜默丟掉，
    # 少了它，同一週同一個素材在不同請求的列就分不出來，evaluation 的重複檢查
    # 會對一份寫出來時是對的表報錯；A39 在 CLI 入口先擋。
    - {name: request_id, type: STRING}
    - {name: score, type: DOUBLE}
    - {name: score_uncalibrated, type: DOUBLE}
    - {name: label, type: INT}
    # parameters_dataset.yaml 的 test_zero_positive_group_ratio > 0 時，test 的列帶權重
    # （有正例的組 1、留下來的無正例組 1／r），evaluation 的預測品質指標拿它加權。
    # 沒宣告的話寫入時會被靜默丟掉；A45 在 training 入口先擋。
    - {name: zero_positive_group_weight, type: DOUBLE}
  partition_filter:
    model_version: ${model_version}
  partition_cols:
    - {name: snap_date, type: STRING}
    - {name: ad_creative, type: STRING}

# --- Evaluation ---
evaluation_segment_columns:
  type: JSONDataset
  filepath: data/evaluation/${model_version}/${snap_date}/segment_columns.json

evaluation_metrics:
  type: JSONDataset
  filepath: data/evaluation/${model_version}/${snap_date}/metrics.json

baseline_metrics:
  type: JSONDataset
  filepath: data/evaluation/${model_version}/${snap_date}/baseline_metrics.json

prediction_quality_metrics:
  type: JSONDataset
  filepath: data/evaluation/${model_version}/${snap_date}/prediction_quality.json

evaluation_metric_ci:
  type: JSONDataset
  filepath: data/evaluation/${model_version}/${snap_date}/diagnosis/metric_ci.json

evaluation_config_shift:
  type: JSONDataset
  filepath: data/evaluation/${model_version}/${snap_date}/diagnosis/config_shift.json

evaluation_item_ability:
  type: JSONDataset
  filepath: data/evaluation/${model_version}/${snap_date}/diagnosis/item_ability.json

evaluation_model_capacity:
  type: JSONDataset
  filepath: data/evaluation/${model_version}/${snap_date}/diagnosis/model_capacity.json

evaluation_suppression:
  type: JSONDataset
  filepath: data/evaluation/${model_version}/${snap_date}/diagnosis/suppression.json

evaluation_report_aggregates:
  type: JSONDataset
  filepath: data/evaluation/${model_version}/${snap_date}/report_aggregates.json

evaluation_report:
  type: TextDataset
  filepath: data/evaluation/${model_version}/${snap_date}/report.html

evaluation_comparison_report:
  type: TextDataset
  filepath: data/evaluation/${model_version}/${snap_date}/report_comparison.html

enriched_eval_predictions:
  type: HiveTableDataset
  database: ${hive.db}
  table: enriched_eval_predictions
  external: false
  columns: "auto"
  partition_filter:
    model_version: ${model_version}
  partition_cols:
    - {name: snap_date, type: STRING}

# --- Evaluation — 正例率基準線的每期彙總表（#397，managed Hive table）---
# 只在 evaluation.baseline.score: rate 時被讀寫；沒開就沒有 node 碰它，也不會建表。
# 每個 time 值 × item 兩個數：當過候選的次數（sample_pool 的列數）、其中的正例數
# （label_table 用 identity LEFT JOIN 接上）。build_popularity_period_counts 只寫
# 還沒算過的期（加上 --rebuild-dates 點名的），dynamic overwrite 只換那幾格；
# compute_baseline_metrics 讀回整張表，把回看窗裡的期加總後相除。
# 與模型無關，所以不按 model_version 分：換模型、重評同一段日期都不重算。
# 分區鍵 popularity_source_version（core/versioning.py 的
# compute_popularity_source_version）是 schema 與 sample_pool／label_table 兩個
# catalog 條目的雜湊：換了來源表或 schema 就落到新分區、全部重算。
# 不用 base_dataset_version：它不含來源表是哪一張。
popularity_period_counts:
  type: HiveTableDataset
  database: ${hive.db}
  table: popularity_period_counts
  external: false
  columns: "auto"
  partition_filter:
    popularity_source_version: ${popularity_source_version}
  partition_cols:
    - {name: snap_date, type: STRING}

# --- Inference ---
inference_population_features:
  type: HiveTableDataset
  database: ${hive.db}
  table: inference_population_features
  external: false
  columns: "auto"
  partition_filter:
