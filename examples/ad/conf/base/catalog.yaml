    - {name: entity_bucket, type: STRING}

unranked_predictions:
  type: HiveTableDataset
  database: ${hive.db}
  table: unranked_predictions
  external: false
  columns:
    - {name: user_id, type: STRING}
    - {name: slot_id, type: STRING}
    - {name: score, type: DOUBLE}
    - {name: score_uncalibrated, type: DOUBLE}
  partition_filter:
    model_version: ${model_version}
  partition_cols:
    - {name: snap_date, type: STRING}
    - {name: ad_creative, type: STRING}
    - {name: entity_bucket, type: STRING}

ranked_staging:
  type: HiveTableDataset
  database: ${hive.db}
  table: ranked_staging
  external: false
  columns:
    - {name: user_id, type: STRING}
    - {name: slot_id, type: STRING}
    - {name: score, type: DOUBLE}
    - {name: score_uncalibrated, type: DOUBLE}
    - {name: rank, type: BIGINT}
  partition_filter:
    model_version: ${model_version}
  partition_cols:
    - {name: snap_date, type: STRING}
    - {name: ad_creative, type: STRING}

ranked_predictions:
  type: HiveTableDataset
  database: ${hive.db}
  table: ranked_predictions
  external: false
  columns:
    - {name: user_id, type: STRING}
    - {name: slot_id, type: STRING}
    - {name: score, type: DOUBLE}
    - {name: score_uncalibrated, type: DOUBLE}
    - {name: rank, type: BIGINT}
  partition_filter:
    model_version: ${model_version}
  partition_cols:
    - {name: snap_date, type: STRING}
    - {name: ad_creative, type: STRING}

score_chunk_report:
  type: JSONDataset
  filepath: data/inference/${model_version}/${snap_date}/chunk_report.json
