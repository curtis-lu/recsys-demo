spark:
  app_name: recsys_tfb_ad_example-inference

inference:
  # 1,200 個 entity（400 個使用者 × 3 個版位）分 10 桶，每桶都有資料
  entity_buckets: 10
  snap_dates:
    - "2026-01-05"   # 資料的最後一週，不在任何訓練／評估 split 裡
  products:          # 須 == schema.categorical_values.ad_creative（A4）
    - c01-banner
    - c01-native
    - c01-video
    - c02-banner
    - c02-native
    - c02-video
    - c03-banner
    - c03-native
    - c03-video
    - c04-banner
    - c04-native
    - c04-video
